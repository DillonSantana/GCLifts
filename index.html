<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GClifts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:wght@400;600;700&display=swap">
<!-- Built by Tailwind from styles/input.css. After changing classes, run: npm run build -->
<link rel="stylesheet" href="styles/app.css">
</head>
<body class="min-h-dvh text-base">

<!-- Layout: phones and tablets stack the map above the app; from lg up the map sits on the left and stays in view.
     The one bold element is the matched ride, shown as a yellow rear-view-mirror parking hang tag. -->
<div class="mx-auto grid max-w-2xl gap-5 pt-4 pb-10 pl-[max(1rem,env(safe-area-inset-left))] pr-[max(1rem,env(safe-area-inset-right))] sm:gap-6 sm:pt-6 lg:max-w-6xl lg:grid-cols-[minmax(0,1.15fr)_minmax(0,1fr)] lg:items-start lg:gap-9 lg:pt-8 lg:pb-14">
  <section class="min-w-0 lg:sticky lg:top-6" aria-label="Map">
    <div class="overflow-hidden rounded-2xl border border-rule bg-panel">
      <svg id="map" class="block h-auto w-full" viewBox="0 0 360 250" role="img" aria-label="Map of campus and nearby stops"></svg>
      <div id="mapcap" class="flex flex-wrap justify-between gap-x-3 gap-y-1 border-t border-rule px-4 py-3 text-sm text-soft [&_b]:text-ink [&_b]:tabular-nums"></div>
    </div>
  </section>
  <section class="flex min-w-0 flex-col gap-4">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2 font-display text-2xl font-black tracking-[-.03em] [font-stretch:125%]">
        <i aria-hidden="true" class="relative inline-block size-[22px] rounded-[6px_6px_11px_11px] bg-permit after:absolute after:top-1 after:left-1/2 after:-ml-[3px] after:size-1.5 after:rounded-full after:bg-ground"></i>GClifts
      </div>
      <span class="min-w-0 truncate text-sm text-soft" id="who"></span>
    </header>
    <nav id="tabs" hidden class="sticky top-0 z-10 -mx-4 flex border-b-[1.5px] border-rule bg-ground px-4 sm:static sm:mx-0 sm:gap-1 sm:px-0">
      <button data-tab="ride" class="-mb-[1.5px] min-h-11 flex-1 border-b-[3px] border-transparent px-3 py-2.5 text-[.95rem] font-bold text-soft hover:text-ink aria-[current=page]:border-route aria-[current=page]:text-ink sm:flex-none">Get a ride</button><button data-tab="drive" class="-mb-[1.5px] min-h-11 flex-1 border-b-[3px] border-transparent px-3 py-2.5 text-[.95rem] font-bold text-soft hover:text-ink aria-[current=page]:border-route aria-[current=page]:text-ink sm:flex-none">Drive</button><button data-tab="log" class="-mb-[1.5px] min-h-11 flex-1 border-b-[3px] border-transparent px-3 py-2.5 text-[.95rem] font-bold text-soft hover:text-ink aria-[current=page]:border-route aria-[current=page]:text-ink sm:flex-none">Ride log</button>
    </nav>
    <main id="view"></main>
  </section>
</div>
<div id="toast" role="status" hidden class="fixed bottom-[calc(20px+env(safe-area-inset-bottom,0px))] left-1/2 z-20 max-w-[calc(100vw-2rem)] -translate-x-1/2 rounded-[10px] bg-ink px-4 py-3 text-[.92rem] font-semibold text-ground shadow-lg"></div>

<script>
const KEY="gclifts-v7";
const PAY=["Cash App","Venmo","PayPal"];
const PURPOSE=[["Groceries",1],["Pharmacy",1],["Clinic",1],["Job interview",1],["Class",0],["Other",0]];
const SPOTS={
  "Russell Library":[96,74],"Maxwell Student Union":[150,108],"Student Health Center":[206,62],
  "The Village apts":[42,168],"Walmart Supercenter":[104,222],"Kroger":[184,188],
  "CVS Pharmacy":[262,196],"Downtown Milledgeville":[296,128],"Bus Station":[310,44],"Airport shuttle stop":[332,226]};
const SCHOOLS=[{name:"Georgia College & State University",short:"GC",city:"Milledgeville, GA",domains:["gcsu.edu","bobcats.gcsu.edu"]}];
const onMap=n=>Object.prototype.hasOwnProperty.call(SPOTS,n);
const pos=n=>SPOTS[n];
const norm=t=>String(t).trim().replace(/\s+/g," ");
const known=t=>Object.keys(SPOTS).find(k=>k.toLowerCase()===norm(t).toLowerCase())||norm(t);
const LABEL={"CVS Pharmacy":[0,20,"middle"],"Kroger":[0,-11,"middle"],"The Village apts":[0,20,"middle"],"Airport shuttle stop":[4,18,"end"]};
const ROADS=[["Russell Library","Maxwell Student Union"],["Maxwell Student Union","Student Health Center"],["Russell Library","Student Health Center"],
  ["Russell Library","The Village apts"],["The Village apts","Walmart Supercenter"],["Maxwell Student Union","Kroger"],["Walmart Supercenter","Kroger"],
  ["Kroger","CVS Pharmacy"],["CVS Pharmacy","Downtown Milledgeville"],["Student Health Center","Bus Station"],["Bus Station","Downtown Milledgeville"],
  ["Downtown Milledgeville","Maxwell Student Union"],["CVS Pharmacy","Airport shuttle stop"],["Downtown Milledgeville","Airport shuttle stop"]];
const seedDrivers=[
  {id:"d1",name:"Jordan Lee",email:"jlee@bobcats.gcsu.edu",car:"Silver Honda Civic",seats:3,pay:["Venmo"],online:true,zone:"Maxwell Student Union"},
  {id:"d2",name:"Aisha Moore",email:"amoore@bobcats.gcsu.edu",car:"Blue Toyota RAV4",seats:4,pay:["PayPal","Venmo"],online:true,zone:"Russell Library"},
  {id:"d3",name:"Marcus Diaz",email:"mdiaz@bobcats.gcsu.edu",car:"Black Toyota Corolla",seats:3,pay:["Cash App"],online:true,zone:"The Village apts"},
  {id:"d4",name:"Priya Shah",email:"pshah@bobcats.gcsu.edu",car:"White VW Jetta",seats:2,pay:["Venmo","PayPal"],online:false,zone:"Downtown Milledgeville"}];
const seedLog=[
  {id:"r1",driverId:"d2",from:"Russell Library",to:"Walmart Supercenter",purpose:"Groceries",when:"2026-10-14T16:20",paidWith:"PayPal",rating:5,confirmed:true},
  {id:"r2",driverId:"d1",from:"Maxwell Student Union",to:"Student Health Center",purpose:"Clinic",when:"2026-10-17T09:05",paidWith:"Venmo",rating:5,confirmed:true},
  {id:"r3",driverId:"d2",from:"The Village apts",to:"CVS Pharmacy",purpose:"Pharmacy",when:"2026-10-19T18:40",paidWith:"Venmo",rating:4,confirmed:true}];

let S;
function fresh(){return{user:null,tab:"ride",drivers:structuredClone(seedDrivers),log:[],seeded:{},
  draft:{from:"Maxwell Student Union",to:"Walmart Supercenter",purpose:"Groceries",pay:["Venmo"],prefer:null},active:null}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){} if(!S||!S.draft)S=fresh(); S.seeded=S.seeded||{}}
// Each rider gets their own copy of the sample rides the first time they sign in on this browser.
function seedRidesFor(email){S.log=S.log.filter(r=>r.riderEmail!==email);
  S.log.push(...seedLog.map(r=>({...r,id:r.id+"-"+email,riderEmail:email,sample:true})));S.seeded[email]=true}
const myLog=()=>S.user?S.log.filter(r=>r.riderEmail===S.user.email).sort((a,b)=>new Date(b.when)-new Date(a.when)):[];
// One seat is in use while the signed-in rider has an active ride with this driver.
const openSeats=d=>d.seats-(S.active&&S.active.driverId===d.id?1:0);
function confirmPending(){if(!S)return;let changed=false;
  S.log.forEach(r=>{if(!r.confirmed&&r.endedAt&&Date.now()-r.endedAt>3000){r.confirmed=true;changed=true}});
  if(changed){save();if(S.user&&S.tab==="log"&&!S.active)render()}}
setInterval(confirmPending,1000);
const isEssential=p=>!!(PURPOSE.find(x=>x[0]===p)||[])[1];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();

const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials=n=>n.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
const first=n=>n.split(" ")[0];
const drv=id=>S.drivers.find(d=>d.id===id);
// Straight-line distance between demo stops; null when either place is not on the demo map.
const dist=(a,b)=>{if(!onMap(a)||!onMap(b))return null;const p=pos(a),q=pos(b);return Math.hypot(p[0]-q[0],p[1]-q[1])};
const miles=(a,b)=>(dist(a,b)/42).toFixed(1);
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}
const opts=sel=>Object.keys(SPOTS).map(s=>`<option${s===sel?" selected":""}>${esc(s)}</option>`).join("");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- shared Tailwind class sets (full strings so Tailwind can find them) ---------- */
const UI={
  stack:"flex flex-col gap-4",
  tight:"flex flex-col gap-2",
  form:"flex flex-col gap-4 rounded-2xl border border-rule bg-panel p-4 sm:p-5",
  h1:"m-0 font-display text-[clamp(2.1rem,6vw,3.3rem)] leading-[.98] font-[850] tracking-[-.02em] [font-stretch:125%]",
  h2:"m-0 font-display text-2xl leading-tight font-extrabold [font-stretch:112%] sm:text-[1.55rem]",
  h3:"m-0 font-display text-[1.05rem] font-bold",
  lede:"max-w-[44ch] text-soft",
  label:"flex flex-col gap-1.5 text-sm font-bold",
  input:"w-full rounded-lg border-[1.5px] border-rule bg-panel px-3 py-2.5 text-base font-normal text-ink placeholder:text-soft",
  go:"min-h-12 w-full rounded-[10px] bg-ink px-4 py-3.5 text-[1.05rem] font-bold text-ground transition-colors hover:bg-route",
  quiet:"min-h-11 shrink-0 rounded-lg border-[1.5px] border-rule px-3.5 py-2 text-sm font-bold text-ink hover:border-ink",
  chips:"flex flex-wrap gap-2",
  chip:"min-h-11 rounded-full border-[1.5px] border-rule bg-panel px-3.5 py-2 text-sm font-semibold text-ink aria-pressed:border-route aria-pressed:bg-route aria-pressed:text-panel",
  legend:"text-sm font-bold",
  hint:"text-sm text-soft",
  sub:"text-sm text-soft",
  err:"min-h-[1.3em] text-sm text-alert",
  face:"grid size-[42px] flex-none place-items-center rounded-full border-[1.5px] border-rule bg-campus font-display text-[.95rem] font-extrabold text-route [font-stretch:110%]",
  pays:"mt-1.5 flex flex-wrap gap-1.5",
  pay:"rounded-[5px] border border-rule bg-ground px-2 py-0.5 text-xs font-semibold text-soft",
  payYes:"rounded-[5px] border border-route bg-ground px-2 py-0.5 text-xs font-semibold text-route",
  profiles:"grid grid-cols-[repeat(auto-fill,minmax(min(100%,240px),1fr))] gap-3",
  prof:"relative flex w-full flex-col gap-3 rounded-2xl border-[1.5px] border-rule bg-panel p-4 text-left text-ink",
  profBtn:"relative flex w-full flex-col gap-3 rounded-2xl border-[1.5px] border-rule bg-panel p-4 text-left text-ink hover:border-soft aria-pressed:border-route aria-pressed:shadow-[inset_0_0_0_2px_var(--route)]",
};

/* ---------- map ---------- */
function curve(a,b){const [x1,y1]=pos(a),[x2,y2]=pos(b);const mx=(x1+x2)/2,my=(y1+y2)/2;const dx=x2-x1,dy=y2-y1;
  return `M${x1} ${y1} Q${mx-dy*.18} ${my+dx*.18} ${x2} ${y2}`}
function drawMap(){
  const a=S.active, from=a?a.from:S.draft.from, to=a?a.to:S.draft.to;
  const d=a?drv(a.driverId):null;
  let s=`<rect width="360" height="250" fill="var(--panel)"/>
  <path d="M60 40 C110 18 240 22 236 74 C232 128 186 140 128 136 C70 132 30 84 60 40Z" fill="var(--campus)"/>
  <text x="70" y="38" font-family="Archivo, system-ui, sans-serif" font-stretch="125%" font-weight="800" font-size="10" fill="var(--soft)">GC campus, Milledgeville</text>`;
  s+=ROADS.map(([p,q])=>`<line x1="${SPOTS[p][0]}" y1="${SPOTS[p][1]}" x2="${SPOTS[q][0]}" y2="${SPOTS[q][1]}" stroke="var(--road)" stroke-width="5" stroke-linecap="round"/>`).join("");
  if(onMap(from)&&onMap(to)&&from!==to)s+=`<path id="rt" d="${curve(from,to)}" fill="none" stroke="var(--route)" stroke-width="4" stroke-linecap="round" ${a?'stroke-dasharray="1 0"':'stroke-dasharray="2 7"'}/>`;
  if(d&&onMap(from)&&d.zone!==from)s+=`<path id="ap" d="${curve(d.zone,from)}" fill="none" stroke="var(--soft)" stroke-width="2" stroke-dasharray="3 4"/>`;
  for(const [name,[x,y]] of Object.entries(SPOTS)){
    const isA=name===from,isB=name===to;
    const r=isA||isB?7:4;
    const fill=isB?"var(--permit)":isA?"var(--panel)":"var(--soft)";
    const stroke=isB?"var(--permit-ink)":isA?"var(--route)":"none";
    const right=x>250,L=LABEL[name]||[right?-11:11,4,right?"end":"start"];
    s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${isA?3:isB?2:0}"/>
      <text x="${x+L[0]}" y="${y+L[1]}" text-anchor="${L[2]}" font-family="Public Sans, system-ui, sans-serif" font-size="${isA||isB?10.5:9}" font-weight="${isA||isB?700:400}" fill="${isA||isB?"var(--ink)":"var(--soft)"}">${esc(name)}</text>`;
  }
  if(!a){S.drivers.filter(x=>x.online&&x.email!==S.user?.email).forEach((x,i)=>{const [cx,cy]=pos(x.zone);
    s+=`<g transform="translate(${cx+(i%2?-9:9)} ${cy-13})"><rect x="-7" y="-5" width="14" height="10" rx="3" fill="var(--route)"/><title>${esc(x.name)} is online</title></g>`})}
  else s+=`<g id="car"><rect x="-8" y="-6" width="16" height="12" rx="3.5" fill="var(--ink)"/><rect x="-4" y="-3" width="8" height="5" rx="1" fill="var(--permit)"/></g>`;
  $("#map").innerHTML=s;
  const cap=$("#mapcap");
  if(!from||!to){cap.innerHTML=`<span>Type a pickup and a drop-off to see your route.</span>`}
  else if(from===to){cap.innerHTML=`<span>Pick two different places.</span>`}
  else if(dist(from,to)===null){const off=[from,to].filter(n=>!onMap(n));
    cap.innerHTML=`<span>${off.map(esc).join(" and ")} ${off.length>1?"aren't":"isn't"} on the demo map, so distance and drive time aren't shown.</span>`}
  else cap.innerHTML=`<span>${esc(from)} to ${esc(to)}</span><span><b>${miles(from,to)} mi</b>, about <b>${Math.max(4,Math.round(dist(from,to)/9))} min</b> drive</span>`;
  if(a&&d)animateCar(d.zone===from?null:$("#ap"));
}
let raf;
// Simulated live location: the car drives from the driver's area to the pickup and the status updates as it goes.
function animateCar(path){
  cancelAnimationFrame(raf);const car=$("#car");if(!car)return;
  const a=S.active,d=drv(a.driverId);
  const at=onMap(a.from)?a.from:d.zone,[px,py]=pos(at);
  const total=onMap(a.from)?dist(d.zone,a.from)/42:null;
  const dur=reduce?0:12000;
  if(!a.startedAt){a.startedAt=Date.now();save()}
  const step=()=>{
    const k=dur?Math.min(1,(Date.now()-a.startedAt)/dur):1;
    if(path){const e=1-Math.pow(1-k,3),pt=path.getPointAtLength(path.getTotalLength()*e*.94);car.setAttribute("transform",`translate(${pt.x} ${pt.y})`)}
    else car.setAttribute("transform",`translate(${px} ${py-14})`);
    trip(k,total);
    if(k<1)raf=requestAnimationFrame(step);
  };
  step();
}
function trip(k,total){
  const a=S.active;if(!a)return;const d=drv(a.driverId),n=first(d.name);
  const stage=k>=1?3:k>.8?2:1;
  const left=a.eta===null?null:Math.max(0,Math.ceil(a.eta*(1-k)));
  const now=$("#st"),sub=$("#stsub");if(!now)return;
  now.textContent=stage===3?`${n} is here. Check the ride code.`:stage===2?`${n} is arriving`:`${n} is on the way`;
  sub.textContent=stage===3?`Look for a ${d.car}.`:total===null?`Heading to ${a.from}.`:total===0?`Already at ${a.from}.`:`${(total*(1-k)).toFixed(1)} mi away, about ${Math.max(1,left)} min.`;
  document.querySelectorAll("#steps span").forEach((x,i)=>x.classList.toggle("on",i<=stage));
  document.querySelectorAll("#steplabels span").forEach((x,i)=>x.innerHTML=i===stage?`<b>${x.textContent}</b>`:x.textContent);
  const eta=$("#etan");if(eta&&left!==null)eta.textContent=stage===3?"0":left;
}

/* ---------- matching ---------- */
function match(){
  const {from,pay,prefer,purpose}=S.draft,me=S.user.email,ess=isEssential(purpose),log=myLog();
  const online=S.drivers.filter(d=>d.online&&d.email!==me&&openSeats(d)>0);
  // Essential trips: drivers hold their last open seat for them. Other trips need at least two open seats.
  const cands=online.filter(d=>ess||openSeats(d)>=2);
  if(!cands.length)return online.length?{full:true}:null;
  const scored=cands.map(d=>{
    const past=log.filter(r=>r.driverId===d.id);
    const km=dist(d.zone,from);
    const avg=past.length?past.reduce((t,r)=>t+r.rating,0)/past.length:0;
    const overlap=d.pay.filter(p=>pay.includes(p));
    let score=km===null?0:-km/20,why=[];
    if(prefer===d.id){score+=100;why.push(`You asked for ${first(d.name)}`)}
    if(past.length){score+=10+past.length*3+avg;why.push(`${past.length} past ride${past.length>1?"s":""} together, ${avg.toFixed(1)} stars`)}
    if(overlap.length){score+=8;why.push(`Takes ${overlap.join(" or ")}`)}else if(pay.length)score-=6;
    if(d.zone===from)why.push(`Already at ${from}`);
    if(ess&&openSeats(d)===1)why.push("Held their last seat for an essential trip");
    return{d,score,why,eta:km===null?null:Math.max(2,Math.round(km/10)+2)};
  }).sort((x,y)=>y.score-x.score);
  return scored[0];
}

const AVC=["#0f766e","#7c3aed","#c2410c","#1d4ed8","#be185d","#4d7c0f"];
const avColor=n=>{let h=0;for(const c of n)h=(h*17+c.charCodeAt(0))>>>0;return AVC[h%AVC.length]};
const VER=`<span class="inline-flex items-center gap-[3px] rounded-full bg-campus px-[7px] py-0.5 font-body text-[.72rem] font-bold text-route" title="School email confirmed with a code"><svg class="size-[11px]" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Verified GC student</span>`;
const payTags=(list,yes)=>list.map(p=>`<span class="${yes.includes(p)?UI.payYes:UI.pay}">${esc(p)}</span>`).join("");
function profile(d,{tag="div",attrs="",paid=[],footer=""}={}){
  const rs=myLog().filter(r=>r.driverId===d.id),avg=rs.length?rs.reduce((t,r)=>t+r.rating,0)/rs.length:0;
  return `<${tag} class="${tag==="button"?UI.profBtn:UI.prof}" ${attrs}>
    <div class="flex items-center gap-3"><span class="relative grid size-[52px] flex-none place-items-center rounded-full font-display text-[1.1rem] font-[850] text-white [font-stretch:115%]" style="background:${avColor(d.name)}">${initials(d.name)}<i class="${d.online?"absolute right-0 bottom-px size-[13px] rounded-full border-[2.5px] border-panel bg-[#22a06b]":"absolute right-0 bottom-px size-[13px] rounded-full border-[2.5px] border-panel bg-soft"}" title="${d.online?"Online now":"Offline"}"></i></span>
      <div class="min-w-0 flex-1"><h3 class="m-0 flex flex-wrap items-center gap-1.5 font-display text-[1.1rem] font-bold">${esc(d.name)} ${VER}</h3><div class="text-sm [overflow-wrap:anywhere] text-soft">${esc(d.car)}</div><div class="text-sm [overflow-wrap:anywhere] text-soft">Usually near ${esc(d.zone)}</div></div></div>
    <div class="grid grid-cols-3 border-y border-rule py-2 *:flex *:flex-col *:items-start [&>div+div]:border-l [&>div+div]:border-rule [&>div+div]:pl-2.5">
      <div><b class="font-display text-[1.15rem] font-extrabold tabular-nums [font-stretch:90%]">${rs.length}</b><span class="text-xs text-soft">rides together</span></div>
      <div><b class="font-display text-[1.15rem] font-extrabold tabular-nums [font-stretch:90%]">${rs.length?avg.toFixed(1):"New"}${rs.length?' <span class="text-[#c99400]">★</span>':""}</b><span class="text-xs text-soft">your rating</span></div>
      <div><b class="font-display text-[1.15rem] font-extrabold tabular-nums [font-stretch:90%]">${openSeats(d)}</b><span class="text-xs text-soft">open seats</span></div></div>
    <div class="${UI.pays}">${payTags(d.pay,paid)}</div>
    ${footer?`<div class="flex flex-wrap items-center justify-between gap-2">${footer}</div>`:""}
  </${tag}>`;
}
const code=()=>"GC-"+String(Math.floor(1000+Math.random()*9000));

/* ---------- views ---------- */
function render(){
  if(S.active&&!drv(S.active.driverId)){S.active=null;save();toast("Your driver is no longer available. Request a new ride.")}
  $("#tabs").hidden=!S.user;
  $("#who").textContent=S.user?(S.user.school?S.user.school+", ":"")+S.user.email:"";
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab?"page":"false"));
  if(!S.user)signin();else({ride:S.active?activeView:rideView,drive:driveView,log:logView})[S.tab]();
  drawMap();
}

let pickedSchool=null,pending=null;
function signin(){
  const intro=`<h1 class="${UI.h1}">Rides from classmates, without the group chat.</h1>
    <p class="${UI.lede}">No more chasing a driver in a crowded GroupMe. Every rider and driver is a verified Georgia College student, you're matched with a driver automatically, and drivers confirm when they've been paid.</p>`;
  if(pickedSchool===null){
    $("#view").innerHTML=`<div class="${UI.stack}">${intro}
    <div class="${UI.form}">
      <h3 class="${UI.h3}">Connect to your school</h3>
      <p class="${UI.hint}">GClifts only matches you with students from the same school.</p>
      <div class="flex flex-col *:border-t *:border-rule *:py-3" id="schools">${SCHOOLS.map((c,i)=>`<button type="button" class="pick flex w-full items-center gap-3 text-left text-inherit hover:text-route" data-i="${i}">
        <span class="${UI.face}">${esc(c.short)}</span><div class="min-w-0 flex-1"><h3 class="${UI.h3}">${esc(c.name)}</h3><div class="${UI.sub}">${esc(c.city)}</div></div></button>`).join("")}</div>
      <p class="${UI.hint}">More schools are coming. Ask your student government to add yours.</p>
    </div></div>`;
    $("#schools").onclick=e=>{const b=e.target.closest(".pick");if(!b)return;pickedSchool=+b.dataset.i;signin()};
    return;
  }
  const sc=SCHOOLS[pickedSchool];
  const head=`<div class="flex items-center gap-3"><span class="${UI.face}">${esc(sc.short)}</span><div class="min-w-0 flex-1"><h3 class="${UI.h3}">${esc(sc.name)}</h3><div class="${UI.sub}">${esc(sc.city)}</div></div>
        <button type="button" class="${UI.quiet}" id="change">Change</button></div>`;
  if(pending){
    $("#view").innerHTML=`<div class="${UI.stack}">${intro}
    <form id="f" class="${UI.form}" novalidate>
      ${head}
      <h3 class="${UI.h3}">Check your email</h3>
      <p class="${UI.hint}">We sent a 6-digit code to <b class="[overflow-wrap:anywhere] text-ink">${esc(pending.email)}</b>. Enter it to confirm the address is yours.</p>
      <div class="rounded-[10px] bg-campus px-3 py-2.5 text-sm">Demo build: no email is actually sent. Your code is <b>${pending.code}</b>.</div>
      <label for="code" class="${UI.label}">Verification code<input id="code" class="${UI.input} text-center font-display text-[1.6rem] font-extrabold tracking-[.3em] [font-stretch:70%]" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"></label>
      <p class="${UI.err}" id="err"></p>
      <button class="${UI.go}">Verify email</button>
      <button type="button" class="${UI.quiet}" id="back">Use a different email</button>
    </form></div>`;
    $("#code").focus();
    $("#change").onclick=()=>{pickedSchool=null;pending=null;signin()};
    $("#back").onclick=()=>{pending=null;signin()};
    $("#f").onsubmit=e=>{e.preventDefault();
      if($("#code").value.replace(/\D/g,"")!==pending.code)return $("#err").textContent="That code doesn't match. Check the email and try again.";
      const {name,email}=pending;pending=null;
      S.user={name,email,school:sc.name};if(!S.seeded[email])seedRidesFor(email);save();render();toast("Email verified");
    };
    return;
  }
  $("#view").innerHTML=`<div class="${UI.stack}">${intro}
    <form id="f" class="${UI.form}" novalidate>
      ${head}
      <label for="email" class="${UI.label}">School email<input id="email" class="${UI.input}" type="email" inputmode="email" autocomplete="email" placeholder="first.last@${esc(sc.domains[1]||sc.domains[0])}"></label>
      <label for="name" class="${UI.label}">Your name<input id="name" class="${UI.input}" autocomplete="name" placeholder="First and last name"></label>
      <p class="${UI.err}" id="err"></p>
      <button class="${UI.go}">Send verification code</button>
    </form></div>`;
  $("#email").focus();
  $("#change").onclick=()=>{pickedSchool=null;signin()};
  $("#f").onsubmit=e=>{e.preventDefault();
    const name=$("#name").value.trim(),email=$("#email").value.trim().toLowerCase(),dom=email.split("@")[1]||"";
    if(!/^[^@\s]+@[^@\s]+$/.test(email)||!sc.domains.includes(dom))return $("#err").textContent=`Use your ${sc.name} email. It must end in @${sc.domains.join(" or @")}.`;
    if(!name)return $("#err").textContent="Enter your name so drivers know who to pick up.";
    pending={name,email,code:String(Math.floor(100000+Math.random()*900000))};signin();
  };
}

function rideView(){
  const D=S.draft;
  const past=[...new Set(myLog().map(r=>r.driverId))].map(drv).filter(d=>d&&d.online&&d.email!==S.user.email);
  $("#view").innerHTML=`<div class="${UI.stack}">
    <h2 class="${UI.h2}">Where are you headed?</h2>
    <div class="${UI.form}">
      <div class="grid grid-cols-[18px_minmax(0,1fr)] items-center gap-x-3">
        <span class="size-3 justify-self-center rounded-full border-[3px] border-route bg-panel"></span><label for="from" class="${UI.label}">Pickup<input id="from" class="${UI.input}" value="${esc(D.from)}" placeholder="Building or address" autocomplete="off"></label>
        <span class="h-3.5 w-0.5 justify-self-center bg-rule"></span><span></span>
        <span class="size-3 justify-self-center rounded-full bg-permit shadow-[inset_0_0_0_2px_var(--permit-ink)]"></span><label for="to" class="${UI.label}">Drop-off<input id="to" class="${UI.input}" value="${esc(D.to)}" placeholder="Store, clinic or address" autocomplete="off"></label>
      </div>
      <div class="${UI.tight}"><span class="${UI.legend}">What's the trip for?</span>
        <div class="${UI.chips}" id="purpose">${PURPOSE.map(([p])=>`<button type="button" class="${UI.chip}" aria-pressed="${p===D.purpose}">${p}</button>`).join("")}</div>
        <span class="${UI.hint}" id="phint"></span></div>
      <div class="${UI.tight}"><span class="${UI.legend}">You can pay with</span>
        <div class="${UI.chips}" id="pay">${PAY.map(p=>`<button type="button" class="${UI.chip}" aria-pressed="${D.pay.includes(p)}">${p}</button>`).join("")}</div></div>
      <p class="${UI.err}" id="err"></p>
      ${(()=>{const on=S.drivers.filter(d=>d.online&&d.email!==S.user.email&&openSeats(d)>0);return on.length?`<div class="flex flex-wrap items-center gap-2.5 text-sm text-soft"><span class="flex *:-ml-2 *:first:ml-0">${on.slice(0,5).map(d=>`<span class="grid size-[30px] place-items-center rounded-full border-2 border-panel font-display text-[.7rem] font-[850] text-white" style="background:${avColor(d.name)}" title="${esc(d.name)}">${initials(d.name)}</span>`).join("")}</span><span>${on.length} driver${on.length>1?"s":""} available to drive now</span></div>`:`<div class="text-sm text-soft">No drivers are available right now.</div>`})()}
      <button class="${UI.go}" id="go">Find my driver</button>
    </div>
    ${past.length?`<div class="${UI.tight}"><h3 class="${UI.h3}">Ride again with someone you know</h3>
      <p class="${UI.hint}">Tap a driver to ask for them. If they're free, you're matched with them first.</p>
      <div class="${UI.profiles}" id="again">${past.map(d=>profile(d,{tag:"button",attrs:`type="button" data-id="${d.id}" aria-pressed="${D.prefer===d.id}"`,paid:D.pay,
        footer:`<span></span><span class="req text-sm font-bold text-route">${D.prefer===d.id?"Requested":"Request"}</span>`})).join("")}</div></div>`:""}
  </div>`;
  const hint=()=>{const ess=PURPOSE.find(p=>p[0]===S.draft.purpose)[1];$("#phint").textContent=ess?"Essential trip. Drivers hold their last open seat for these.":"Drivers hold their last open seat for essential trips (groceries, pharmacy, clinic, job interview)."};hint();
  $("#from").oninput=e=>{D.from=known(e.target.value);save();drawMap()};
  $("#to").oninput=e=>{D.to=known(e.target.value);save();drawMap()};
  $("#purpose").onclick=e=>{const c=e.target.closest("button");if(!c)return;D.purpose=c.textContent;
    $("#purpose").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===c));hint();save()};
  $("#pay").onclick=e=>{const c=e.target.closest("button");if(!c)return;const on=c.getAttribute("aria-pressed")!=="true";c.setAttribute("aria-pressed",on);
    D.pay=on?[...D.pay,c.textContent]:D.pay.filter(p=>p!==c.textContent);save()};
  const ag=$("#again");if(ag)ag.onclick=e=>{const b=e.target.closest("[data-id]");if(!b)return;D.prefer=D.prefer===b.dataset.id?null:b.dataset.id;
    ag.querySelectorAll("[data-id]").forEach(x=>{const on=x.dataset.id===D.prefer;x.setAttribute("aria-pressed",on);x.querySelector(".req").textContent=on?"Requested":"Request"});save()};
  $("#go").onclick=()=>{
    if(!D.from||!D.to)return $("#err").textContent="Type where you want to be picked up and dropped off.";
    if(D.from.toLowerCase()===D.to.toLowerCase())return $("#err").textContent="Pickup and drop-off are the same place. Change one of them.";
    if(!D.pay.length)return $("#err").textContent="Choose at least one way you can pay.";
    const m=match();
    if(!m)return $("#err").textContent="No drivers are online right now. Try again in a few minutes.";
    if(m.full)return $("#err").textContent="Every online driver has one seat left, and it's held for essential trips. Try again soon, or pick an essential trip type if that's what this is.";
    S.active={driverId:m.d.id,from:D.from,to:D.to,purpose:D.purpose,why:m.why,eta:m.eta,pay:[...D.pay],code:code(),when:new Date().toISOString()};
    D.prefer=null;save();render();toast(`Matched with ${first(m.d.name)}`);
  };
}

const REPLIES=[[/where|which|spot|find/i,"I'll pull up right out front. Look for the {car}."],[/late|minute|wait|hold/i,"No problem, I'll wait a couple of minutes."],
  [/pay|venmo|paypal|cash ?app/i,"{pay} works for me. Send it after the ride."],[/thank|thx|ty\b/i,"Anytime!"],[/.*/,"Sounds good, see you soon."]];
const MSG={
  me:"max-w-[80%] self-end rounded-[14px] rounded-br-[4px] bg-route px-3 py-2 text-[.92rem] leading-[1.4] [overflow-wrap:anywhere] text-panel",
  them:"max-w-[80%] self-start rounded-[14px] rounded-bl-[4px] border border-rule bg-ground px-3 py-2 text-[.92rem] leading-[1.4] [overflow-wrap:anywhere]",
};
function activeView(){
  const a=S.active,d=drv(a.driverId),ok=d.pay.filter(p=>a.pay.includes(p)),n=first(d.name);
  if(!a.chat){a.chat=[{who:"them",text:`Hey, it's ${n}. I'm on my way in the ${d.car}.`,t:Date.now()}];save()}
  const shareText=`I'm riding with ${d.name} (${d.car}) from ${a.from} to ${a.to}. Ride code ${a.code}.${a.eta===null?"":` ETA ${a.eta} min.`} Sent from GClifts.`;
  const tm=t=>new Date(t).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  const bubbles=()=>a.chat.map(m=>`<div class="${MSG[m.who]}">${esc(m.text)}<small class="mt-0.5 block text-[.72rem] opacity-75">${m.who==="me"?"You":esc(n)}, ${tm(m.t)}</small></div>`).join("");
  $("#view").innerHTML=`<div class="${UI.stack}">
    <div class="flex flex-col gap-2.5 rounded-2xl border border-rule bg-panel p-4 sm:p-5" aria-live="polite">
      <div class="font-display text-[1.3rem] leading-[1.2] font-extrabold [font-stretch:108%]" id="st">${esc(n)} is on the way</div><div class="${UI.sub}" id="stsub"></div>
      <div class="grid grid-cols-4 gap-1.5 *:h-1.5 *:rounded-[3px] *:bg-rule [&>.on]:bg-route" id="steps"><span class="on"></span><span></span><span></span><span></span></div>
      <div class="grid grid-cols-4 gap-1.5 text-xs text-soft [&_b]:text-ink" id="steplabels"><span>Matched</span><span>On the way</span><span>Arriving</span><span>Here</span></div>
    </div>
    <div class="relative mx-auto w-full max-w-[360px] origin-[50%_33px] rounded-[26px_26px_14px_14px] bg-permit px-[22px] pt-[58px] pb-[22px] text-permit-ink shadow-[0_18px_30px_-18px_rgba(40,34,0,.55)] motion-safe:animate-swing before:absolute before:top-[18px] before:left-1/2 before:-ml-[15px] before:size-[30px] before:rounded-full before:bg-ground before:shadow-[inset_0_2px_4px_rgba(0,0,0,.25)]" role="group" aria-label="Your matched ride">
      <div class="flex justify-between border-b-2 border-permit-ink pb-2 font-display text-[.95rem] font-extrabold [font-stretch:125%]"><span>GClifts</span><span>${esc(a.purpose)}</span></div>
      <div class="mt-3.5 font-display text-[clamp(3rem,14vw,4.4rem)] leading-none font-black tracking-[.02em] tabular-nums [font-stretch:62%]">${a.code}</div>
      <div class="text-sm font-semibold">Ask your driver to say this code before you get in.</div>
      <div class="mt-4 grid grid-cols-[1fr_auto] items-end gap-x-3 gap-y-0.5"><div class="min-w-0"><h3 class="m-0 font-display text-[1.35rem] font-bold [font-stretch:110%]">${esc(d.name)}</h3><div>${esc(d.car)}</div></div>
        ${a.eta===null?`<div class="text-right"><small class="block text-[.8rem] font-semibold">On the way</small></div>`:`<div class="text-right font-display text-[2rem] leading-none font-black tabular-nums [font-stretch:80%]"><span id="etan">${a.eta}</span><small class="block font-body text-[.8rem] font-semibold">min away</small></div>`}</div>
      <div class="mt-3.5 border-t-2 border-dashed border-permit-ink pt-2.5 text-sm">${a.why.length?esc(a.why.join(". "))+".":"Closest driver who's online."}</div>
    </div>
    <div class="${UI.form}">
      <h3 class="${UI.h3}">Message ${esc(n)}</h3>
      <div class="flex max-h-[260px] flex-col gap-2 overflow-y-auto px-0.5 py-1" id="chat">${bubbles()}</div>
      <div class="min-h-[1.2em] text-[.82rem] text-soft" id="typing"></div>
      <form class="flex items-stretch gap-2" id="chatf"><input id="chatin" class="${UI.input} min-w-0" placeholder="Write a message" aria-label="Message ${esc(n)}" autocomplete="off"><button class="${UI.quiet}">Send</button></form>
      <p class="${UI.hint}">Only you and ${esc(n)} can see these messages. In this demo, ${esc(n)}'s replies are automatic.</p>
    </div>
    <div class="${UI.form}">
      <div class="${UI.tight}"><h3 class="${UI.h3}">How ${esc(n)} likes to be paid</h3>
        <div class="${UI.pays}">${payTags(d.pay,ok)}</div>
        <p class="${UI.hint}">${ok.length?`Highlighted options match what you said you can pay with.`:`None of these match what you picked. Sort it out with ${esc(n)} before the ride.`} Payment happens between you two, outside the app. ${esc(n)} confirms in GClifts when it arrives.</p></div>
      <div class="${UI.tight}"><span class="${UI.legend}">Share your trip</span>
        <div class="flex items-stretch gap-2"><input id="sharetxt" class="${UI.input} min-w-0" readonly value="${esc(shareText)}" aria-label="Trip details to share"><button class="${UI.quiet}" id="copy">Copy</button></div></div>
    </div>
    <div class="${UI.form}">
      <h3 class="${UI.h3}">When you arrive</h3>
      <div class="grid gap-3 sm:grid-cols-2">
        <label for="paid" class="${UI.label}">You paid with<select id="paid" class="${UI.input}">${d.pay.map(p=>`<option${p===ok[0]?" selected":""}>${esc(p)}</option>`).join("")}</select></label>
        <label for="rate" class="${UI.label}">Rating<select id="rate" class="${UI.input}">${[5,4,3,2,1].map(v=>`<option value="${v}">${v} star${v>1?"s":""}</option>`).join("")}</select></label>
      </div>
      <button class="${UI.go}" id="done">Finish ride and save to log</button>
      <button class="${UI.quiet}" id="cancel">Cancel this ride</button>
    </div></div>`;
  const box=$("#chat");box.scrollTop=box.scrollHeight;
  $("#chatf").onsubmit=e=>{e.preventDefault();const t=$("#chatin").value.trim();if(!t)return;
    a.chat.push({who:"me",text:t,t:Date.now()});$("#chatin").value="";save();box.innerHTML=bubbles();box.scrollTop=box.scrollHeight;
    $("#typing").textContent=`${n} is typing...`;
    setTimeout(()=>{if(S.active!==a)return;const r=REPLIES.find(([re])=>re.test(t))[1].replace("{car}",d.car).replace("{pay}",ok[0]||d.pay[0]);
      a.chat.push({who:"them",text:r,t:Date.now()});save();const b=$("#chat");if(!b)return;$("#typing").textContent="";b.innerHTML=bubbles();b.scrollTop=b.scrollHeight},1400)};
  $("#copy").onclick=async()=>{const i=$("#sharetxt");try{await navigator.clipboard.writeText(i.value);toast("Trip details copied")}catch(e){i.select();toast("Selected. Press copy on your keyboard.")}};
  $("#done").onclick=()=>{S.log.unshift({id:"r"+Date.now(),riderEmail:S.user.email,driverId:d.id,from:a.from,to:a.to,purpose:a.purpose,when:a.when,
      paidWith:$("#paid").value,rating:+$("#rate").value,confirmed:false,endedAt:Date.now()});
    S.active=null;S.tab="log";save();render();toast(`Ride saved. Waiting for ${n} to confirm your payment.`)};
  $("#cancel").onclick=()=>{S.active=null;save();render();toast("Ride canceled")};
}

function driveView(){
  const me=S.drivers.find(d=>d.email===S.user.email);
  const essentials=PURPOSE.filter(p=>p[1]).map(p=>p[0]).join(", ").toLowerCase();
  $("#view").innerHTML=`<div class="${UI.stack}">
    <h2 class="${UI.h2}">Drive for classmates</h2>
    <p class="${UI.lede}">Riders are matched with you automatically and see how you like to be paid. After each ride you confirm the payment arrived, so you're not chasing anyone in a group chat. Your last open seat is held for essential trips (${essentials}).</p>
    <div class="${UI.form}">
      <label for="online" class="flex min-h-11 items-center justify-between gap-3 text-sm font-bold"><span>I'm available to drive now</span>
        <input id="online" type="checkbox" class="size-[22px] flex-none accent-route" ${me?.online?"checked":""}></label>
      <div class="grid gap-3 sm:grid-cols-[2fr_1fr]">
        <label for="car" class="${UI.label}">Car<input id="car" class="${UI.input}" value="${esc(me?.car||"")}" placeholder="Color, make and model"></label>
        <label for="seats" class="${UI.label}">Open seats<input id="seats" class="${UI.input}" type="number" inputmode="numeric" min="1" max="6" value="${me?.seats||3}"></label>
      </div>
      <label for="zone" class="${UI.label}">General area<select id="zone" class="${UI.input}">${opts(me?.zone||"Maxwell Student Union")}</select></label>
      <div class="${UI.tight}"><span class="${UI.legend}">Payment you prefer</span>
        <div class="${UI.chips}" id="dpay">${PAY.map(p=>`<button type="button" class="${UI.chip}" aria-pressed="${(me?.pay||["Venmo"]).includes(p)}">${p}</button>`).join("")}</div></div>
      <p class="${UI.err}" id="err"></p>
      <button class="${UI.go}" id="saveD">Save driver profile</button>
    </div></div>`;
  $("#dpay").onclick=e=>{const c=e.target.closest("button");if(c)c.setAttribute("aria-pressed",c.getAttribute("aria-pressed")!=="true")};
  $("#saveD").onclick=()=>{
    const pay=[...document.querySelectorAll("#dpay button[aria-pressed=true]")].map(c=>c.textContent);
    const car=$("#car").value.trim();
    if(!car)return $("#err").textContent="Add your car so riders can spot you.";
    if(!pay.length)return $("#err").textContent="Pick at least one way you'd like to be paid.";
    const data={name:S.user.name,email:S.user.email,car,
      seats:Math.max(1,+$("#seats").value||1),pay,online:$("#online").checked,zone:$("#zone").value};
    if(me)Object.assign(me,data);else S.drivers.push({id:"u-"+S.user.email,...data});
    save();drawMap();toast(data.online?"Driver profile saved. You're available.":"Driver profile saved");
  };
}

function logView(){
  const log=myLog();
  const by={};log.forEach(r=>(by[r.driverId]=by[r.driverId]||[]).push(r));
  const people=Object.entries(by).sort((a,b)=>b[1].length-a[1].length);
  const payCount={};log.forEach(r=>payCount[r.paidWith]=(payCount[r.paidWith]||0)+1);
  const topPay=Object.entries(payCount).sort((a,b)=>b[1]-a[1])[0];
  const fmt=w=>new Date(w).toLocaleDateString("en-US",{month:"short",day:"numeric"});
  const name=r=>{const d=drv(r.driverId);return d?first(d.name):""};
  const paystat=r=>r.confirmed?`<span class="text-[.82rem] font-bold text-route">Confirmed</span>`:`<span class="text-[.82rem] font-bold text-soft">Waiting for driver</span>`;
  $("#view").innerHTML=`<div class="${UI.stack}">
    <h2 class="${UI.h2}">Ride log</h2>
    ${log.length?`<p class="max-w-[36ch] font-display text-[1.15rem] leading-[1.35] font-bold [font-stretch:105%]">${log.length} ride${log.length>1?"s":""} with ${people.length} driver${people.length>1?"s":""}. You pay with ${esc(topPay[0])} most often.</p>`:""}
    <div class="${UI.tight}"><h3 class="${UI.h3}">Drivers you've ridden with</h3>
      <div class="${UI.profiles}">${people.map(([id,rs])=>{const d=drv(id);if(!d)return"";const paid=[...new Set(rs.map(r=>r.paidWith))];
        return profile(d,{paid,footer:`<span class="${UI.sub}">Last ride ${fmt(rs[0].when)}. You paid with ${paid.map(esc).join(", ")}.</span>`})}).join("")
        ||`<p class="${UI.hint}">No rides yet. After your first ride, that driver shows up here and gets matched with you first next time.</p>`}</div></div>
    ${log.length?`<div class="${UI.tight}"><h3 class="${UI.h3}">Every ride</h3>
      <ul class="flex flex-col sm:hidden *:border-t *:border-rule *:py-3">
      ${log.map(r=>`<li><div class="flex justify-between gap-3"><span class="font-semibold">${esc(r.from)} to ${esc(r.to)}</span><span class="shrink-0 tabular-nums text-soft">${fmt(r.when)}</span></div>
        <div class="${UI.sub}">${esc(r.purpose||"")}${r.purpose?" · ":""}${esc(name(r))} · ${esc(r.paidWith)} · <span class="text-[#c99400]">${"★".repeat(r.rating)}</span></div>
        <div>${paystat(r)}</div></li>`).join("")}
      </ul>
      <div class="hidden overflow-x-auto sm:block"><table class="w-full min-w-[440px] border-collapse text-sm [&_td]:border-b [&_td]:border-rule [&_td]:px-2 [&_td]:py-2.5 [&_td]:text-left [&_th]:border-b [&_th]:border-rule [&_th]:px-2 [&_th]:py-2.5 [&_th]:text-left [&_th]:text-xs [&_th]:font-semibold [&_th]:text-soft">
      <thead><tr><th>Date</th><th>Trip</th><th>For</th><th>Driver</th><th>Payment</th><th>Rating</th></tr></thead><tbody>
      ${log.map(r=>`<tr><td class="whitespace-nowrap tabular-nums">${fmt(r.when)}</td><td>${esc(r.from)} to ${esc(r.to)}</td><td>${esc(r.purpose||"")}</td><td>${esc(name(r))}</td><td>${esc(r.paidWith)} ${paystat(r)}</td><td class="whitespace-nowrap tabular-nums">${"★".repeat(r.rating)}</td></tr>`).join("")}
      </tbody></table></div></div>`:""}
    <div class="flex flex-wrap gap-2.5"><button class="${UI.quiet}" id="reset">Reset my sample rides</button><button class="${UI.quiet}" id="out">Sign out</button></div>
  </div>`;
  $("#reset").onclick=()=>{S.active=null;seedRidesFor(S.user.email);save();render();toast("Your sample rides were restored")};
  $("#out").onclick=()=>{pickedSchool=null;pending=null;S.user=null;S.active=null;S.tab="ride";save();render()};
}

$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.tab=b.dataset.tab;save();render()};
