<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GClifts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Layout: a single centered app column.
   The one bold element is the matched ride, shown as a yellow rear-view-mirror parking hang tag.
   Palette is Georgia College navy and green plus permit yellow. One family, Archivo, does all the type:
   wide for headings, normal for reading, condensed for codes and numbers, like campus road signage. */
:root{
  --ground:#eef0f4; --panel:#ffffff; --ink:#14213d; --soft:#56607a; --rule:#d3d8e2;
  --permit:#f5c518; --permit-ink:#1c1a10; --route:#1e6b47; --campus:#e1ece5; --alert:#b4233c;
  --display:"Archivo",system-ui,sans-serif; --body:"Archivo",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0e1526; --panel:#162038; --ink:#e8ecf4; --soft:#9aa5bd; --rule:#29355a;
  --permit:#f5c518; --permit-ink:#1c1a10; --route:#5cc493; --campus:#173326; --alert:#f48a9c; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0e1526; --panel:#162038; --ink:#e8ecf4; --soft:#9aa5bd; --rule:#29355a;
  --permit:#f5c518; --permit-ink:#1c1a10; --route:#5cc493; --campus:#173326; --alert:#f48a9c; color-scheme:dark}

[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.55 var(--body)}
.shell{max-width:600px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
@media (min-width:900px){.shell{padding-block:32px 56px}}
.appcol{min-width:0}

h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(2.1rem,6vw,3.3rem);line-height:.98;font-weight:850;font-stretch:125%;letter-spacing:-.02em}
h2{font-size:1.55rem;line-height:1.1;font-weight:800;font-stretch:112%}
h3{font-size:1.05rem;font-weight:700;font-stretch:100%}
p{margin:0}
.lede{color:var(--soft);max-width:44ch}
.stack{display:flex;flex-direction:column;gap:16px}
.tight{gap:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* masthead + nav */
.mast{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font:900 1.5rem var(--display);font-stretch:125%;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:6px 6px 11px 11px;background:var(--permit);display:inline-block;position:relative}
.logo i::after{content:"";position:absolute;top:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ground)}
.whoami{color:var(--soft);font-size:.85rem}
nav.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--rule)}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1.5px;border-radius:0;
  padding:10px 12px;font:700 .95rem var(--body);color:var(--soft);cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--route)}

/* controls */
label{font-weight:700;font-size:.88rem;display:flex;flex-direction:column;gap:6px}
input,select{font:inherit;font-weight:400;color:var(--ink);background:var(--panel);border:1.5px solid var(--rule);border-radius:6px;padding:11px 12px;width:100%}
input:hover,select:hover{border-color:var(--soft)}
:focus-visible{outline:3px solid var(--route);outline-offset:2px}
button{font:700 1rem var(--body);cursor:pointer}
.go{background:var(--ink);color:var(--ground);border:0;border-radius:8px;padding:15px 18px;width:100%;font-size:1.05rem;font-stretch:112%}
.go:hover{background:var(--route)}
.quiet{background:none;border:1.5px solid var(--rule);color:var(--ink);border-radius:8px;padding:9px 13px;font-size:.9rem}
.quiet:hover{border-color:var(--ink)}
.err{color:var(--alert);font-size:.9rem;min-height:1.3em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 .88rem var(--body);padding:7px 12px;border-radius:999px;border:1.5px solid var(--rule);background:var(--panel);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--route);border-color:var(--route);color:var(--panel)}
.legend{font-weight:700;font-size:.88rem}
.hint{color:var(--soft);font-size:.85rem}
.trip{display:grid;grid-template-columns:18px minmax(0,1fr);gap:0 12px;align-items:center}
.trip .pin{width:12px;height:12px;border-radius:50%;justify-self:center}
.trip .a{border:3px solid var(--route);background:var(--panel)}
.trip .b{background:var(--permit);box-shadow:0 0 0 2px var(--permit-ink) inset}
.trip .line{width:2px;height:14px;background:var(--rule);justify-self:center}
/* Sections sit on the page, divided by a rule; only things you pick up or tap (tag, driver profiles) are cards. */
.form{border-top:1.5px solid var(--rule);padding-top:20px}
.stack>.form:first-child,h2+.form{border-top:0;padding-top:0}
.form>h3:first-child{font-size:1.2rem;font-stretch:112%}

/* people */
.person{display:flex;gap:12px;align-items:center}
.person>div{min-width:0;flex:1}
.face{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 .95rem var(--display);font-stretch:110%;background:var(--campus);color:var(--route);border:1.5px solid var(--rule)}
.sub{color:var(--soft);font-size:.88rem}
.pays{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pay{font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:5px;background:var(--ground);border:1px solid var(--rule);color:var(--soft)}
.pay.yes{color:var(--route);border-color:var(--route)}
.list{display:flex;flex-direction:column}
.list>*{padding-block:12px;border-top:1px solid var(--rule)}
.pick{background:none;border:0;text-align:left;color:inherit;padding-inline:0;width:100%;font:inherit}
.pick[aria-pressed="true"] .face{background:var(--route);color:var(--panel);border-color:var(--route)}
.pick .chosen{display:none;color:var(--route);font-weight:700;font-size:.85rem}
.pick[aria-pressed="true"] .chosen{display:inline}

/* driver profile cards */
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.prof{position:relative;display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1.5px solid var(--rule);border-radius:10px;padding:16px;text-align:left;color:var(--ink);font:inherit;width:100%}
button.prof{cursor:pointer}
button.prof:hover{border-color:var(--soft)}
button.prof[aria-pressed="true"]{border-color:var(--route);box-shadow:0 0 0 2px var(--route) inset}
.prof .top{display:flex;gap:12px;align-items:center}
.prof .top>div{min-width:0;flex:1}
.av{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font:850 1.1rem var(--display);font-stretch:115%;color:#fff;position:relative}
.av .live{position:absolute;right:0;bottom:1px;width:13px;height:13px;border-radius:50%;background:var(--soft);border:2.5px solid var(--panel)}
.av .live.on{background:var(--route)}
.prof h3{font-size:1.1rem;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ver{display:inline-flex;align-items:center;gap:3px;font:700 .72rem var(--body);color:var(--route);background:var(--campus);border-radius:999px;padding:2px 7px}
.ver svg{width:11px;height:11px}
.prof .car{font-size:.88rem;color:var(--soft);overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding-block:8px}
.stats div{display:flex;flex-direction:column;align-items:flex-start}
.stats div+div{padding-left:10px;border-left:1px solid var(--rule)}
.stats b{font:800 1.3rem var(--display);font-stretch:75%;font-variant-numeric:tabular-nums}
.stats span{font-size:.75rem;color:var(--soft)}
.stars{color:#c99400}
.prof .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.req{font:700 .85rem var(--body);color:var(--route)}


/* the hang tag */
.tag{position:relative;background:var(--permit);color:var(--permit-ink);border-radius:26px 26px 14px 14px;padding:58px 22px 22px;
  max-width:360px;width:100%;margin-inline:auto;box-shadow:0 18px 30px -18px rgba(40,34,0,.55)}
.tag::before{content:"";position:absolute;top:18px;left:50%;width:30px;height:30px;margin-left:-15px;border-radius:50%;background:var(--ground);box-shadow:inset 0 2px 4px rgba(0,0,0,.25)}
.tag .issuer{font:800 .95rem var(--display);font-stretch:125%;display:flex;justify-content:space-between;border-bottom:2px solid var(--permit-ink);padding-bottom:8px}
.tag .code{font:900 clamp(3rem,14vw,4.4rem)/1 var(--display);font-stretch:62%;letter-spacing:.02em;margin-top:14px;font-variant-numeric:tabular-nums}
.tag .codehint{font-size:.85rem;font-weight:600}
.tag .who{margin-top:16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:end}
.tag .who h3{font-size:1.35rem;font-stretch:110%}
.tag .eta{font:900 2rem/1 var(--display);font-stretch:80%;text-align:right;font-variant-numeric:tabular-nums}
.tag .eta small{display:block;font:600 .8rem var(--body)}
.tag .why{margin-top:14px;padding-top:10px;border-top:2px dashed var(--permit-ink);font-size:.88rem}
@media (prefers-reduced-motion:no-preference){.tag{animation:swing 1.1s cubic-bezier(.3,1.6,.5,1) both;transform-origin:50% 33px}
  @keyframes swing{0%{transform:rotate(-9deg)}55%{transform:rotate(3deg)}100%{transform:rotate(0)}}}

table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:440px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--rule)}
th{font-size:.8rem;color:var(--soft);font-weight:600}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.summary{font:700 1.15rem/1.35 var(--display);font-stretch:105%;max-width:36ch}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:11px 16px;border-radius:10px;font-size:.92rem;font-weight:600;z-index:5}
.share{display:flex;gap:8px;align-items:stretch}
.share input{font-size:.85rem}
/* live trip status */
.status{display:flex;flex-direction:column;gap:10px}
.status .now{font:800 1.45rem/1.15 var(--display);font-stretch:115%}
/* Progress reads as a lane line: dashed road ahead, solid where the driver has already been. */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.steps span{height:5px;background:repeating-linear-gradient(90deg,var(--rule) 0 14px,transparent 14px 22px)}
.steps span.on{background:var(--route)}
.steplabels{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:.78rem;color:var(--soft)}
.steplabels b{color:var(--ink)}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;padding:4px 2px}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;font-size:.92rem;line-height:1.4;overflow-wrap:anywhere}
.msg.them{align-self:flex-start;background:var(--panel);border:1px solid var(--rule);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--route);color:var(--panel);border-bottom-right-radius:4px}
.msg small{display:block;font-size:.72rem;opacity:.75;margin-top:2px}
.typing{font-size:.82rem;color:var(--soft);min-height:1.2em}
/* available drivers strip */
.avail{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.9rem;color:var(--soft)}
.avail .faces{display:flex}
.avail .faces .av{width:30px;height:30px;font-size:.7rem;border:2px solid var(--panel);margin-left:-8px}
.avail .faces .av:first-child{margin-left:0}
/* verification code */
.codebox{font:800 1.6rem var(--display);font-stretch:70%;letter-spacing:.3em;text-align:center}
.demo{background:var(--campus);border-radius:6px;padding:10px 12px;font-size:.88rem}
.paystat{font-size:.82rem;font-weight:700}
.paystat.ok{color:var(--route)} .paystat.wait,.paystat.sim{color:var(--soft)}
.paystat.sim{font-style:italic}
</style>
</head>
<body>

<div class="shell">
  <section class="appcol stack">
    <header class="mast">
      <div class="logo"><i aria-hidden="true"></i>GClifts</div>
      <span class="whoami" id="who"></span>
    </header>
    <nav class="tabs" id="tabs" hidden>
      <button data-tab="ride">Get a ride</button><button data-tab="drive">Drive</button><button data-tab="log">Ride log</button>
    </nav>
    <main id="view"></main>
  </section>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const KEY="gclifts-v7";
const PAY=["Cash App","Venmo","PayPal"];
const PURPOSE=[["Groceries",1],["Pharmacy",1],["Clinic",1],["Job interview",1],["Class",0],["Other",0]];
const SPOTS={
  "Russell Library":[96,74],"Maxwell Student Union":[150,108],"Student Health Center":[206,62],
  "The Village apts":[42,168],"Walmart Supercenter":[104,222],"Kroger":[184,188],
  "CVS Pharmacy":[262,196],"Downtown Milledgeville":[296,128],"Bus Station":[310,44],"Airport shuttle stop":[332,226]};
const SCHOOLS=[{name:"Georgia College & State University",short:"GC",city:"Milledgeville, GA",domains:["gcsu.edu","bobcats.gcsu.edu"]}];
const onMap=n=>Object.prototype.hasOwnProperty.call(SPOTS,n);
const pos=n=>SPOTS[n];
const norm=t=>String(t).trim().replace(/\s+/g," ");
const known=t=>Object.keys(SPOTS).find(k=>k.toLowerCase()===norm(t).toLowerCase())||norm(t);
const seedDrivers=[
  {id:"d1",name:"Jordan Lee",email:"jlee@bobcats.gcsu.edu",car:"Silver Honda Civic",seats:3,pay:["Venmo"],online:true,zone:"Maxwell Student Union"},
  {id:"d2",name:"Aisha Moore",email:"amoore@bobcats.gcsu.edu",car:"Blue Toyota RAV4",seats:4,pay:["PayPal","Venmo"],online:true,zone:"Russell Library"},
  {id:"d3",name:"Marcus Diaz",email:"mdiaz@bobcats.gcsu.edu",car:"Black Toyota Corolla",seats:3,pay:["Cash App"],online:true,zone:"The Village apts"},
  {id:"d4",name:"Priya Shah",email:"pshah@bobcats.gcsu.edu",car:"White VW Jetta",seats:2,pay:["Venmo","PayPal"],online:false,zone:"Downtown Milledgeville"}];
const seedLog=[
  {id:"r1",driverId:"d2",from:"Russell Library",to:"Walmart Supercenter",purpose:"Groceries",when:"2026-10-14T16:20",paidWith:"PayPal",rating:5,confirmed:true},
  {id:"r2",driverId:"d1",from:"Maxwell Student Union",to:"Student Health Center",purpose:"Clinic",when:"2026-10-17T09:05",paidWith:"Venmo",rating:5,confirmed:true},
  {id:"r3",driverId:"d2",from:"The Village apts",to:"CVS Pharmacy",purpose:"Pharmacy",when:"2026-10-19T18:40",paidWith:"Venmo",rating:4,confirmed:true}];

let S;
function fresh(){return{user:null,tab:"ride",drivers:structuredClone(seedDrivers),log:[],seeded:{},
  draft:{from:"Maxwell Student Union",to:"Walmart Supercenter",purpose:"Groceries",pay:["Venmo"],prefer:null},active:null}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){} if(!S||!S.draft)S=fresh(); S.seeded=S.seeded||{}}
// Each rider gets their own copy of the sample rides the first time they sign in on this browser.
function seedRidesFor(email){S.log=S.log.filter(r=>r.riderEmail!==email);
  S.log.push(...seedLog.map(r=>({...r,id:r.id+"-"+email,riderEmail:email,sample:true})));S.seeded[email]=true}
const myLog=()=>S.user?S.log.filter(r=>r.riderEmail===S.user.email).sort((a,b)=>new Date(b.when)-new Date(a.when)):[];
// One seat is in use while the signed-in rider has an active ride with this driver.
const openSeats=d=>d.seats-(S.active&&S.active.driverId===d.id?1:0);
// Sample drivers aren't real people, so nobody can confirm their payments. Those rides are auto-confirmed and
// flagged as simulated. Rides with a real classmate's driver profile wait until that driver confirms in the Drive tab.
const isSampleDriver=id=>seedDrivers.some(d=>d.id===id);
function confirmPending(){if(!S)return;let changed=false;
  S.log.forEach(r=>{if(!r.confirmed&&r.endedAt&&isSampleDriver(r.driverId)&&Date.now()-r.endedAt>3000){r.confirmed=true;r.simulated=true;changed=true}});
  if(changed){save();if(S.user&&S.tab==="log"&&!S.active)render()}}
setInterval(confirmPending,1000);
const isEssential=p=>!!(PURPOSE.find(x=>x[0]===p)||[])[1];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();

const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials=n=>n.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
const first=n=>n.split(" ")[0];
const drv=id=>S.drivers.find(d=>d.id===id);
// Straight-line distance between demo stops; null when either place is not on the demo map.
const dist=(a,b)=>{if(!onMap(a)||!onMap(b))return null;const p=pos(a),q=pos(b);return Math.hypot(p[0]-q[0],p[1]-q[1])};
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}
const opts=sel=>Object.keys(SPOTS).map(s=>`<option${s===sel?" selected":""}>${esc(s)}</option>`).join("");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- ride status ---------- */
let raf;
// Simulated driver progress: the status card moves from "on the way" to "here" over a few seconds.
function trackRide(){
  cancelAnimationFrame(raf);const a=S.active;if(!a||!$("#st"))return;
  const d=drv(a.driverId);
  const total=onMap(a.from)?dist(d.zone,a.from)/42:null;
  const dur=reduce?0:12000;
  if(!a.startedAt){a.startedAt=Date.now();save()}
  const step=()=>{
    const k=dur?Math.min(1,(Date.now()-a.startedAt)/dur):1;
    trip(k,total);
    if(k<1)raf=requestAnimationFrame(step);
  };
  step();
}
function trip(k,total){
  const a=S.active;if(!a)return;const d=drv(a.driverId),n=first(d.name);
  const stage=k>=1?3:k>.8?2:1;
  const left=a.eta===null?null:Math.max(0,Math.ceil(a.eta*(1-k)));
  const now=$("#st"),sub=$("#stsub");if(!now)return;
  now.textContent=stage===3?`${n} is here. Check the ride code.`:stage===2?`${n} is arriving`:`${n} is on the way`;
  sub.textContent=stage===3?`Look for a ${d.car}.`:total===null?`Heading to ${a.from}.`:total===0?`Already at ${a.from}.`:`${(total*(1-k)).toFixed(1)} mi away, about ${Math.max(1,left)} min.`;
  document.querySelectorAll("#steps span").forEach((x,i)=>x.classList.toggle("on",i<=stage));
  document.querySelectorAll("#steplabels span").forEach((x,i)=>x.innerHTML=i===stage?`<b>${x.textContent}</b>`:x.textContent);
  const eta=$("#etan");if(eta&&left!==null)eta.textContent=stage===3?"0":left;
}

/* ---------- matching ---------- */
function match(){
  const {from,pay,prefer,purpose}=S.draft,me=S.user.email,ess=isEssential(purpose),log=myLog();
  const online=S.drivers.filter(d=>d.online&&d.email!==me&&openSeats(d)>0);
  // Essential trips: drivers hold their last open seat for them. Other trips need at least two open seats.
  const cands=online.filter(d=>ess||openSeats(d)>=2);
  if(!cands.length)return online.length?{full:true}:null;
  const scored=cands.map(d=>{
    const past=log.filter(r=>r.driverId===d.id);
    const km=dist(d.zone,from);
    const avg=past.length?past.reduce((t,r)=>t+r.rating,0)/past.length:0;
    const overlap=d.pay.filter(p=>pay.includes(p));
    let score=km===null?0:-km/20,why=[];
    if(prefer===d.id){score+=100;why.push(`You asked for ${first(d.name)}`)}
    if(past.length){score+=10+past.length*3+avg;why.push(`${past.length} past ride${past.length>1?"s":""} together, ${avg.toFixed(1)} stars`)}
    if(overlap.length){score+=8;why.push(`Takes ${overlap.join(" or ")}`)}else if(pay.length)score-=6;
    if(d.zone===from)why.push(`Already at ${from}`);
    if(ess&&openSeats(d)===1)why.push("Held their last seat for an essential trip");
    return{d,score,why,eta:km===null?null:Math.max(2,Math.round(km/10)+2)};
  }).sort((x,y)=>y.score-x.score);
  return scored[0];
}

// School-palette shades, dark enough for white initials and distinct from the navy dark-mode cards.
const AVC=["#1e6b47","#3d5a80","#7a5512","#2f6f73"];
const avColor=n=>{let h=0;for(const c of n)h=(h*17+c.charCodeAt(0))>>>0;return AVC[h%AVC.length]};
const VER=`<span class="ver" title="School email confirmed with a code"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Verified GC student</span>`;
function profile(d,{tag="div",attrs="",paid=[],footer=""}={}){
  const rs=myLog().filter(r=>r.driverId===d.id),avg=rs.length?rs.reduce((t,r)=>t+r.rating,0)/rs.length:0;
  return `<${tag} class="prof" ${attrs}>
    <div class="top"><span class="av" style="background:${avColor(d.name)}">${initials(d.name)}<i class="live ${d.online?"on":""}" title="${d.online?"Online now":"Offline"}"></i></span>
      <div><h3>${esc(d.name)} ${VER}</h3><div class="car">${esc(d.car)}</div><div class="car">Usually near ${esc(d.zone)}</div></div></div>
    <div class="stats"><div><b>${rs.length}</b><span>rides together</span></div>
      <div><b>${rs.length?avg.toFixed(1):"New"}${rs.length?' <span class="stars">★</span>':""}</b><span>your rating</span></div>
      <div><b>${openSeats(d)}</b><span>open seats</span></div></div>
    <div class="pays">${d.pay.map(p=>`<span class="pay ${paid.includes(p)?"yes":""}">${esc(p)}</span>`).join("")}</div>
    ${footer?`<div class="foot">${footer}</div>`:""}
  </${tag}>`;
}
const code=()=>"GC-"+String(Math.floor(1000+Math.random()*9000));

/* ---------- views ---------- */
function render(){
  if(S.active&&!drv(S.active.driverId)){S.active=null;save();toast("Your driver is no longer available. Request a new ride.")}
  $("#tabs").hidden=!S.user;
  $("#who").textContent=S.user?(S.user.school?S.user.school+", ":"")+S.user.email:"";
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab?"page":"false"));
  if(!S.user)signin();else({ride:S.active?activeView:rideView,drive:driveView,log:logView})[S.tab]();
  trackRide();
}

let pickedSchool=null,pending=null;
function signin(){
  const intro=`<h1>Rides from classmates, without the group chat.</h1>
    <p class="lede">Every rider and driver is a verified Georgia College student. You're matched with a driver automatically, and drivers confirm when you've paid.</p>`;
  if(pickedSchool===null){
    $("#view").innerHTML=`<div class="stack">${intro}
    <div class="form stack">
      <h3>Connect to your school</h3>
      <p class="hint">GClifts only matches you with students from the same school.</p>
      <div class="list" id="schools">${SCHOOLS.map((c,i)=>`<button type="button" class="pick person" data-i="${i}">
        <span class="face">${esc(c.short)}</span><div><h3>${esc(c.name)}</h3><div class="sub">${esc(c.city)}</div></div></button>`).join("")}</div>
      <p class="hint">More schools are coming. Ask your student government to add yours.</p>
    </div></div>`;
    $("#schools").onclick=e=>{const b=e.target.closest(".pick");if(!b)return;pickedSchool=+b.dataset.i;signin()};
    return;
  }
  const sc=SCHOOLS[pickedSchool];
  const head=`<div class="person"><span class="face">${esc(sc.short)}</span><div><h3>${esc(sc.name)}</h3><div class="sub">${esc(sc.city)}</div></div>
        <button type="button" class="quiet" id="change">Change</button></div>`;
  if(pending){
    $("#view").innerHTML=`<div class="stack">${intro}
    <form id="f" class="form stack" novalidate>
      ${head}
      <h3>Check your email</h3>
      <p class="hint">We sent a 6-digit code to <b>${esc(pending.email)}</b>. Enter it to confirm the address is yours.</p>
      <div class="demo">Demo build: no email is actually sent. Your code is <b>${pending.code}</b>.</div>
      <label for="code">Verification code<input id="code" class="codebox" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000"></label>
      <p class="err" id="err"></p>
      <button class="go">Verify email</button>
      <button type="button" class="quiet" id="back">Use a different email</button>
    </form></div>`;
    $("#code").focus();
    $("#change").onclick=()=>{pickedSchool=null;pending=null;signin()};
    $("#back").onclick=()=>{pending=null;signin()};
    $("#f").onsubmit=e=>{e.preventDefault();
      if($("#code").value.replace(/\D/g,"")!==pending.code)return $("#err").textContent="That code doesn't match. Check the email and try again.";
      const {name,email}=pending;pending=null;
      S.user={name,email,school:sc.name};if(!S.seeded[email])seedRidesFor(email);save();render();toast("Email verified");
    };
    return;
  }
  $("#view").innerHTML=`<div class="stack">${intro}
    <form id="f" class="form stack" novalidate>
      ${head}
      <label for="email">School email<input id="email" type="email" autocomplete="email" placeholder="first.last@${esc(sc.domains[1]||sc.domains[0])}"></label>
      <label for="name">Your name<input id="name" autocomplete="name" placeholder="First and last name"></label>
      <p class="err" id="err"></p>
      <button class="go">Send verification code</button>
    </form></div>`;
  $("#email").focus();
  $("#change").onclick=()=>{pickedSchool=null;signin()};
  $("#f").onsubmit=e=>{e.preventDefault();
    const name=$("#name").value.trim(),email=$("#email").value.trim().toLowerCase(),dom=email.split("@")[1]||"";
    if(!/^[^@\s]+@[^@\s]+$/.test(email)||!sc.domains.includes(dom))return $("#err").textContent=`Use your ${sc.name} email. It must end in @${sc.domains.join(" or @")}.`;
    if(!name)return $("#err").textContent="Enter your name so drivers know who to pick up.";
    pending={name,email,code:String(Math.floor(100000+Math.random()*900000))};signin();
  };
}

function rideView(){
  const D=S.draft;
  const past=[...new Set(myLog().map(r=>r.driverId))].map(drv).filter(d=>d&&d.online&&d.email!==S.user.email);
  $("#view").innerHTML=`<div class="stack">
    <h2>Where are you headed?</h2>
    <div class="form stack">
      <div class="trip">
        <span class="pin a"></span><label for="from">Pickup<input id="from" value="${esc(D.from)}" placeholder="Building or address" autocomplete="off"></label>
        <span class="line"></span><span></span>
        <span class="pin b"></span><label for="to">Drop-off<input id="to" value="${esc(D.to)}" placeholder="Store, clinic or address" autocomplete="off"></label>
      </div>
      <div class="stack tight"><span class="legend">What's the trip for?</span>
        <div class="chips" id="purpose">${PURPOSE.map(([p])=>`<button type="button" class="chip" aria-pressed="${p===D.purpose}">${p}</button>`).join("")}</div>
        <span class="hint" id="phint"></span></div>
      <div class="stack tight"><span class="legend">You can pay with</span>
        <div class="chips" id="pay">${PAY.map(p=>`<button type="button" class="chip" aria-pressed="${D.pay.includes(p)}">${p}</button>`).join("")}</div></div>
      <p class="err" id="err"></p>
      ${(()=>{const on=S.drivers.filter(d=>d.online&&d.email!==S.user.email&&openSeats(d)>0);return on.length?`<div class="avail"><span class="faces">${on.slice(0,5).map(d=>`<span class="av" style="background:${avColor(d.name)}" title="${esc(d.name)}">${initials(d.name)}</span>`).join("")}</span><span>${on.length} driver${on.length>1?"s":""} available to drive now</span></div>`:`<div class="avail">No drivers are available right now.</div>`})()}
      <button class="go" id="go">Find my driver</button>
    </div>
    ${past.length?`<div class="stack tight"><h3>Ride again with someone you know</h3>
      <p class="hint">Tap a driver to ask for them. If they're free, you're matched with them first.</p>
      <div class="profiles" id="again">${past.map(d=>profile(d,{tag:"button",attrs:`type="button" data-id="${d.id}" aria-pressed="${D.prefer===d.id}"`,paid:D.pay,
        footer:`<span></span><span class="req">${D.prefer===d.id?"Requested":"Request"}</span>`})).join("")}</div></div>`:""}
  </div>`;
  const hint=()=>{const ess=PURPOSE.find(p=>p[0]===S.draft.purpose)[1];$("#phint").textContent=ess?"Essential trip. Drivers hold their last open seat for these.":"Drivers hold their last open seat for essential trips (groceries, pharmacy, clinic, job interview)."};hint();
  $("#from").oninput=e=>{D.from=known(e.target.value);save()};
  $("#to").oninput=e=>{D.to=known(e.target.value);save()};
  $("#purpose").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;D.purpose=c.textContent;
    $("#purpose").querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c));hint();save()};
  $("#pay").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;const on=c.getAttribute("aria-pressed")!=="true";c.setAttribute("aria-pressed",on);
    D.pay=on?[...D.pay,c.textContent]:D.pay.filter(p=>p!==c.textContent);save()};
  const ag=$("#again");if(ag)ag.onclick=e=>{const b=e.target.closest(".prof");if(!b)return;D.prefer=D.prefer===b.dataset.id?null:b.dataset.id;
    ag.querySelectorAll(".prof").forEach(x=>{const on=x.dataset.id===D.prefer;x.setAttribute("aria-pressed",on);x.querySelector(".req").textContent=on?"Requested":"Request"});save()};
  $("#go").onclick=()=>{
    if(!D.from||!D.to)return $("#err").textContent="Type where you want to be picked up and dropped off.";
    if(D.from.toLowerCase()===D.to.toLowerCase())return $("#err").textContent="Pickup and drop-off are the same place. Change one of them.";
    if(!D.pay.length)return $("#err").textContent="Choose at least one way you can pay.";
    const m=match();
    if(!m)return $("#err").textContent="No drivers are online right now. Try again in a few minutes.";
    if(m.full)return $("#err").textContent="Every online driver has one seat left, and it's held for essential trips. Try again soon, or pick an essential trip type if that's what this is.";
    S.active={driverId:m.d.id,from:D.from,to:D.to,purpose:D.purpose,why:m.why,eta:m.eta,pay:[...D.pay],code:code(),when:new Date().toISOString()};
    D.prefer=null;save();render();toast(`Matched with ${first(m.d.name)}`);
  };
}

const REPLIES=[[/where|which|spot|find/i,"I'll pull up right out front. Look for the {car}."],[/late|minute|wait|hold/i,"No problem, I'll wait a couple of minutes."],
  [/pay|venmo|paypal|cash ?app/i,"{pay} works for me. Send it after the ride."],[/thank|thx|ty\b/i,"Anytime!"],[/.*/,"Sounds good, see you soon."]];
function activeView(){
  const a=S.active,d=drv(a.driverId),ok=d.pay.filter(p=>a.pay.includes(p)),n=first(d.name);
  if(!a.chat){a.chat=[{who:"them",text:`Hey, it's ${n}. I'm on my way in the ${d.car}.`,t:Date.now()}];save()}
  const shareText=`I'm riding with ${d.name} (${d.car}) from ${a.from} to ${a.to}. Ride code ${a.code}.${a.eta===null?"":` ETA ${a.eta} min.`} Sent from GClifts.`;
  const tm=t=>new Date(t).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  const bubbles=()=>a.chat.map(m=>`<div class="msg ${m.who}">${esc(m.text)}<small>${m.who==="me"?"You":esc(n)}, ${tm(m.t)}</small></div>`).join("");
  $("#view").innerHTML=`<div class="stack">
    <div class="form status" aria-live="polite">
      <div class="now" id="st">${esc(n)} is on the way</div><div class="sub" id="stsub"></div>
      <div class="steps" id="steps"><span class="on"></span><span></span><span></span><span></span></div>
      <div class="steplabels" id="steplabels"><span>Matched</span><span>On the way</span><span>Arriving</span><span>Here</span></div>
    </div>
    <div class="tag" role="group" aria-label="Your matched ride">
      <div class="issuer"><span>GClifts</span><span>${esc(a.purpose)}</span></div>
      <div class="code">${a.code}</div>
      <div class="codehint">Ask your driver to say this code before you get in.</div>
      <div class="who"><div><h3>${esc(d.name)}</h3><div>${esc(d.car)}</div></div>
        ${a.eta===null?`<div class="eta"><small>On the way</small></div>`:`<div class="eta"><span id="etan">${a.eta}</span><small>min away</small></div>`}</div>
      <div class="why">${a.why.length?esc(a.why.join(". "))+".":"Closest driver who's online."}</div>
    </div>
    <div class="form stack">
      <h3>Message ${esc(n)}</h3>
      <div class="chat" id="chat">${bubbles()}</div>
      <div class="typing" id="typing"></div>
      <form class="share" id="chatf"><input id="chatin" placeholder="Write a message" aria-label="Message ${esc(n)}" autocomplete="off"><button class="quiet">Send</button></form>
      <p class="hint">Only you and ${esc(n)} can see these messages. In this demo, ${esc(n)}'s replies are automatic.</p>
    </div>
    <div class="form stack">
      <div class="stack tight"><h3>How ${esc(n)} likes to be paid</h3>
        <div class="pays">${d.pay.map(p=>`<span class="pay ${ok.includes(p)?"yes":""}">${esc(p)}</span>`).join("")}</div>
        <p class="hint">${ok.length?`Highlighted options match what you said you can pay with.`:`None of these match what you picked. Sort it out with ${esc(n)} before the ride.`} Payment happens between you two, outside the app. ${esc(n)} confirms in GClifts when it arrives.</p></div>
      <div class="stack tight"><span class="legend">Share your trip</span>
        <div class="share"><input id="sharetxt" readonly value="${esc(shareText)}" aria-label="Trip details to share"><button class="quiet" id="copy">Copy</button></div></div>
    </div>
    <div class="form stack">
      <h3>When you arrive</h3>
      <div class="row" style="align-items:stretch">
        <label for="paid" style="flex:1;min-width:150px">You paid with<select id="paid">${d.pay.map(p=>`<option${p===ok[0]?" selected":""}>${esc(p)}</option>`).join("")}</select></label>
        <label for="rate" style="flex:1;min-width:120px">Rating<select id="rate">${[5,4,3,2,1].map(v=>`<option value="${v}">${v} star${v>1?"s":""}</option>`).join("")}</select></label>
      </div>
      <button class="go" id="done">Finish ride and save to log</button>
      <button class="quiet" id="cancel">Cancel this ride</button>
    </div></div>`;
  const box=$("#chat");box.scrollTop=box.scrollHeight;
  $("#chatf").onsubmit=e=>{e.preventDefault();const t=$("#chatin").value.trim();if(!t)return;
    a.chat.push({who:"me",text:t,t:Date.now()});$("#chatin").value="";save();box.innerHTML=bubbles();box.scrollTop=box.scrollHeight;
    $("#typing").textContent=`${n} is typing...`;
    setTimeout(()=>{if(S.active!==a)return;const r=REPLIES.find(([re])=>re.test(t))[1].replace("{car}",d.car).replace("{pay}",ok[0]||d.pay[0]);
      a.chat.push({who:"them",text:r,t:Date.now()});save();const b=$("#chat");if(!b)return;$("#typing").textContent="";b.innerHTML=bubbles();b.scrollTop=b.scrollHeight},1400)};
  $("#copy").onclick=async()=>{const i=$("#sharetxt");try{await navigator.clipboard.writeText(i.value);toast("Trip details copied")}catch(e){i.select();toast("Selected. Press copy on your keyboard.")}};
  $("#done").onclick=()=>{S.log.unshift({id:"r"+Date.now(),riderEmail:S.user.email,driverId:d.id,from:a.from,to:a.to,purpose:a.purpose,when:a.when,
      paidWith:$("#paid").value,rating:+$("#rate").value,confirmed:false,endedAt:Date.now()});
    S.active=null;S.tab="log";save();render();toast(`Ride saved. Waiting for ${n} to confirm your payment.`)};
  $("#cancel").onclick=()=>{S.active=null;save();render();toast("Ride canceled")};
}

function driveView(){
  const me=S.drivers.find(d=>d.email===S.user.email);
  const toConfirm=me?S.log.filter(r=>r.driverId===me.id&&!r.confirmed):[];
  const essentials=PURPOSE.filter(p=>p[1]).map(p=>p[0]).join(", ").toLowerCase();
  $("#view").innerHTML=`<div class="stack">
    <h2>Drive for classmates</h2>
    <p class="lede">Riders are matched with you automatically and see how you like to be paid. After each ride you confirm the payment arrived, so you're not chasing anyone in a group chat. Your last open seat is held for essential trips (${essentials}).</p>
    <div class="form stack">
      <label for="online" class="row" style="flex-direction:row;justify-content:space-between"><span>I'm available to drive now</span>
        <input id="online" type="checkbox" style="width:22px;height:22px" ${me?.online?"checked":""}></label>
      <div class="row" style="align-items:stretch">
        <label for="car" style="flex:2;min-width:170px">Car<input id="car" value="${esc(me?.car||"")}" placeholder="Color, make and model"></label>
        <label for="seats" style="flex:1;min-width:90px">Open seats<input id="seats" type="number" min="1" max="6" value="${me?.seats||3}"></label>
      </div>
      <label for="zone">General area<select id="zone">${opts(me?.zone||"Maxwell Student Union")}</select></label>
      <div class="stack tight"><span class="legend">Payment you prefer</span>
        <div class="chips" id="dpay">${PAY.map(p=>`<button type="button" class="chip" aria-pressed="${(me?.pay||["Venmo"]).includes(p)}">${p}</button>`).join("")}</div></div>
      <p class="err" id="err"></p>
      <button class="go" id="saveD">Save driver profile</button>
    </div>
    ${toConfirm.length?`<div class="stack tight"><h3>Payments to confirm</h3>
      ${toConfirm.map(r=>`<div class="row" style="justify-content:space-between;align-items:center">
        <span>${esc(r.from)} to ${esc(r.to)}, paid with ${esc(r.paidWith)}</span>
        <button class="quiet" data-confirm="${esc(r.id)}">I got paid</button></div>`).join("")}</div>`:""}
  </div>`;
  $("#view").querySelectorAll("[data-confirm]").forEach(b=>b.onclick=()=>{const r=S.log.find(x=>x.id===b.dataset.confirm);
    if(r){r.confirmed=true;save();render();toast("Payment confirmed")}});
  $("#dpay").onclick=e=>{const c=e.target.closest(".chip");if(c)c.setAttribute("aria-pressed",c.getAttribute("aria-pressed")!=="true")};
  $("#saveD").onclick=()=>{
    const pay=[...document.querySelectorAll("#dpay .chip[aria-pressed=true]")].map(c=>c.textContent);
    const car=$("#car").value.trim();
    if(!car)return $("#err").textContent="Add your car so riders can spot you.";
    if(!pay.length)return $("#err").textContent="Pick at least one way you'd like to be paid.";
    const data={name:S.user.name,email:S.user.email,car,
      seats:Math.max(1,+$("#seats").value||1),pay,online:$("#online").checked,zone:$("#zone").value};
    if(me)Object.assign(me,data);else S.drivers.push({id:"u-"+S.user.email,...data});
    save();toast(data.online?"Driver profile saved. You're available.":"Driver profile saved");
  };
}

function payStatus(r){
  if(!r.confirmed)return `<span class="paystat wait">Waiting for driver</span>`;
  if(r.simulated||r.sample)return `<span class="paystat sim" title="Sample driver: this confirmation was simulated, not made by a real driver">Confirmed (simulated)</span>`;
  return `<span class="paystat ok">Confirmed by driver</span>`;
}

function logView(){
  const log=myLog();
  const by={};log.forEach(r=>(by[r.driverId]=by[r.driverId]||[]).push(r));
  const people=Object.entries(by).sort((a,b)=>b[1].length-a[1].length);
  const payCount={};log.forEach(r=>payCount[r.paidWith]=(payCount[r.paidWith]||0)+1);
  const topPay=Object.entries(payCount).sort((a,b)=>b[1]-a[1])[0];
  const fmt=w=>new Date(w).toLocaleDateString("en-US",{month:"short",day:"numeric"});
  $("#view").innerHTML=`<div class="stack">
    <h2>Ride log</h2>
    ${log.length?`<p class="summary">${log.length} ride${log.length>1?"s":""} with ${people.length} driver${people.length>1?"s":""}. You pay with ${esc(topPay[0])} most often.</p>`:""}
    <div class="stack tight"><h3>Drivers you've ridden with</h3>
      <div class="profiles">${people.map(([id,rs])=>{const d=drv(id);if(!d)return"";const paid=[...new Set(rs.map(r=>r.paidWith))];
        return profile(d,{paid,footer:`<span class="sub">Last ride ${new Date(rs[0].when).toLocaleDateString("en-US",{month:"short",day:"numeric"})}. You paid with ${paid.map(esc).join(", ")}.</span>`})}).join("")
        ||`<p class="hint">No rides yet. After your first ride, that driver shows up here and gets matched with you first next time.</p>`}</div></div>
    ${log.length?`<div class="stack tight"><h3>Every ride</h3><div class="scroll"><table>
      <thead><tr><th>Date</th><th>Trip</th><th>For</th><th>Driver</th><th>Payment</th><th>Rating</th></tr></thead><tbody>
      ${log.map(r=>{const d=drv(r.driverId);return `<tr><td class="num">${fmt(r.when)}</td><td>${esc(r.from)} to ${esc(r.to)}</td><td>${esc(r.purpose||"")}</td><td>${esc(d?first(d.name):"")}</td><td>${esc(r.paidWith)} ${payStatus(r)}</td><td class="num">${"★".repeat(r.rating)}</td></tr>`}).join("")}
      </tbody></table></div></div>`:""}
    <div class="row"><button class="quiet" id="reset">Reset my sample rides</button><button class="quiet" id="out">Sign out</button></div>
  </div>`;
  $("#reset").onclick=()=>{S.active=null;seedRidesFor(S.user.email);save();render();toast("Your sample rides were restored")};
  $("#out").onclick=()=>{const me=S.drivers.find(d=>d.email===S.user.email);if(me)me.online=false;
    pickedSchool=null;pending=null;S.user=null;S.active=null;S.tab="ride";save();render()};
}

$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.tab=b.dataset.tab;save();render()};
render();
</script>
</body>
</html>
