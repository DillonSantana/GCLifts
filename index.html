const KEY="gclifts-v9";
// Bumping KEY resets everyone's saved data: drop any older gclifts-* entries on load.
try{Object.keys(localStorage).forEach(k=>{if(k.startsWith("gclifts-")&&k!==KEY)localStorage.removeItem(k)})}catch(e){}

// Cash changes hands in person, so copy that assumes an app transfer needs its own wording.
const CASH="Cash";
const payInvite=p=>p===CASH?"Cash works for me. You can pay me at drop-off.":`${p} works for me. Send it after the ride.`;
const paidNote=p=>p===CASH?"I handed you cash at drop-off. Let me know if it wasn't right.":"I sent it right after the ride. Let me know if it doesn't show up.";
function confirmHint(pay){const apps=pay.filter(p=>p!==CASH),cash=pay.includes(CASH);
  const when=apps.length?`When a payment shows up in your ${apps.join(" or ")} app${cash?" or a rider hands you cash":""}`:"When a rider hands you cash";
  return `${when}, confirm it here. The rider sees it in their ride log.`}
// [longitude, latitude]. Student Union, Health Center and Bus Station are approximate.
const SPOTS={
  "Russell Library":[-83.22947,33.08092],"Maxwell Student Union":[-83.2306,33.0794],"Student Health Center":[-83.2325,33.0820],

const CAMPUS=[-83.2306,33.0801];
// A made-up spot a few blocks from campus. Shared instead of the device's real location when

const DEMO_SPOT=[-83.2352,33.0846];
const DEMO_RADIUS_MI=25;

// A driver's link to one ride (index.html#drive=<id>) opens the driver screen instead of the app.
const DRIVE_ID=(location.hash.match(/^#drive=([\w-]{8,64})$/)||[])[1]||null;
const SCHOOLS=[{name:"Georgia College & State University",short:"GC",city:"Milledgeville, GA",domains:["gcsu.edu","bobcats.gcsu.edu"]}];

const pos=n=>SPOTS[n];
const norm=t=>String(t).trim().replace(/\s+/g," ");

const seedDrivers=[

  {id:"d2",name:"Aisha Moore",email:"amoore@bobcats.gcsu.edu",car:"Blue Toyota RAV4",seats:4,pay:["PayPal","Venmo"],online:true,zone:"Russell Library"},

  {id:"d4",name:"Priya Shah",email:"pshah@bobcats.gcsu.edu",car:"White VW Jetta",seats:2,pay:["Venmo","PayPal"],online:false,zone:"Downtown Milledgeville"}];
const seedLog=[
  {id:"r1",driverId:"d2",from:"Russell Library",to:"Walmart Supercenter",when:"2026-10-14T16:20",paidWith:"PayPal",rating:5,confirmed:true},
  {id:"r2",driverId:"d1",from:"Maxwell Student Union",to:"Student Health Center",when:"2026-10-17T09:05",paidWith:"Venmo",rating:5,review:"Waited while I checked in. Really appreciated it.",confirmed:true},

let S;
function fresh(){return{user:null,tab:"ride",drivers:structuredClone(seedDrivers),log:[],seeded:{},

// Each rider gets their own copy of the sample rides the first time they sign in on this browser.

function seedRidesFor(email){S.log=S.log.filter(r=>!(r.riderEmail===email&&r.sample));
  S.log.push(...seedLog.map(r=>({...r,id:r.id+"-"+email,riderEmail:email,sample:true})));S.seeded[email]=true}
// A new driver gets two sample riders so the Drive tab shows payment confirmation and messages right away.
const seedRiders=[
  {riderName:"Maya Garcia",riderEmail:"mgarcia@bobcats.gcsu.edu",from:"Maxwell Student Union",to:"CVS Pharmacy",when:"2026-10-20T15:10",rating:5,review:"Super friendly and right on time.",confirmed:false,
    chat:[{who:"rider",text:"Thanks for the ride! I just sent the money.",t:Date.parse("2026-10-20T15:32")}]},
  {riderName:"Tyler Brooks",riderEmail:"tbrooks@bobcats.gcsu.edu",from:"The Village apts",to:"Kroger",when:"2026-10-18T11:30",rating:5,confirmed:true,
    chat:[{who:"rider",text:"I'm by the front gate.",t:Date.parse("2026-10-18T11:24")},{who:"driver",text:"Pulling up now.",t:Date.parse("2026-10-18T11:25")}]}];

  S.log.push(...seedRiders.map((r,i)=>({...structuredClone(r),id:"s"+i+"-"+d.id,driverId:d.id,paidWith:d.pay[0],sample:true})));S.seeded["driver:"+d.id]=true}
const myLog=()=>S.user?S.log.filter(r=>r.riderEmail===S.user.email).sort((a,b)=>new Date(b.when)-new Date(a.when)):[];
// One seat is in use while the signed-in rider has an active ride with this driver.
const openSeats=d=>d.seats-(S.active&&S.active.driverId===d.id?1:0);
// The driver screen often shares a browser with the rider's tab, so it never writes saved state.
function confirmPending(){if(!S||DRIVE_ID)return;let changed=false;
  // Sample drivers confirm on their own after a few seconds; a driver who signed up on this browser confirms in their Drive tab.
  S.log.forEach(r=>{if(!r.confirmed&&r.endedAt&&!String(r.driverId).startsWith("u-")&&Date.now()-r.endedAt>3000){r.confirmed=true;changed=true}});
  if(changed){save();if(S.user&&S.tab==="log"&&!S.active)render()}}
setInterval(confirmPending,1000);
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();

const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials=n=>n.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
const first=n=>n.split(" ")[0];
const drv=id=>S.drivers.find(d=>d.id===id);
// Miles between two [lng,lat] points, as the crow flies.
function miles(p,q){const r=x=>x*Math.PI/180,dLat=r(q[1]-p[1]),dLng=r(q[0]-p[0]);
  const h=Math.sin(dLat/2)**2+Math.cos(r(p[1]))*Math.cos(r(q[1]))*Math.sin(dLng/2)**2;return 2*3958.8*Math.asin(Math.sqrt(h))}
// Straight-line miles between demo stops; null when either place isn't a known stop.
const dist=(a,b)=>isStop(a)&&isStop(b)?miles(pos(a),pos(b)):null;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}
const opts=sel=>Object.keys(SPOTS).map(s=>`<option${s===sel?" selected":""}>${esc(s)}</option>`).join("");

  profiles:"grid grid-cols-[repeat(auto-fill,minmax(min(100%,240px),1fr))] gap-3",

  profBtn:"relative flex w-full flex-col gap-3 rounded-2xl border-[1.5px] border-rule bg-panel p-4 text-left text-ink hover:border-soft aria-pressed:border-route aria-pressed:shadow-[inset_0_0_0_2px_var(--route)]",

/* ---------- trip ---------- */
// Distance and drive time between two known stops, shown under the pickup and drop-off fields.
const samePlace=(a,b)=>a.toLowerCase()===b.toLowerCase();
function routeHint(from,to){
  if(!from||!to)return"Type a pickup and a drop-off.";
  if(samePlace(from,to))return"Pick two different places.";
  const mi=dist(from,to);
  if(mi===null)return geo.ready?"Finding that place on the map...":"Distance and drive time show for known campus and town stops.";
  return`${mi.toFixed(1)} mi, about ${Math.max(4,Math.round(mi*3))} min drive.`;
}

/* ---------- maps and live tracking ---------- */
const CFG=window.GCLIFTS_CONFIG||null;
const isPt=p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite);
// The point a fraction k of the way along a line, measured by distance.
function along(line,k){
  const seg=line.slice(1).map((p,i)=>miles(line[i],p));
  let want=seg.reduce((t,s)=>t+s,0)*Math.min(1,Math.max(0,k));
  for(let i=0;i<seg.length;i++){
    if(want<=seg[i]){const t=seg[i]?want/seg[i]:0,a=line[i],b=line[i+1];return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}
    want-=seg[i];
  }
  return line[line.length-1];
}

// Amazon Location Service calls made with the page's restricted browser key. Results are cached
// for the page's lifetime because every lookup is billed.
class GeoService{
  constructor(cfg){this.cfg=cfg;this.places=new Map();this.routes=new Map()}
  get ready(){return!!(this.cfg&&this.cfg.locationKey)}
  url(svc,path){return`https://${svc}.geo.${this.cfg.region}.amazonaws.com/v2/${path}?key=${encodeURIComponent(this.cfg.locationKey)}`}
  styleUrl(dark){return this.url("maps","styles/Standard/descriptor")+"&color-scheme="+(dark?"Dark":"Light")}
  async post(svc,path,body){
    const r=await fetch(this.url(svc,path),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
    if(!r.ok)throw new Error(`Location Service ${svc} returned ${r.status}`);
    return r.json();
  }
  cached(map,key,load){if(!map.has(key))map.set(key,load().catch(e=>{map.delete(key);throw e}));return map.get(key)}
  // Known stops skip the lookup; anything else is searched only within NEAR_MI of campus, so a typed
  // place never lands in another state. No match nearby means no pin and straight-line estimates.
  async locate(name){
    if(isStop(name))return pos(name);
    if(!this.ready)return null;
    return this.cached(this.places,name.toLowerCase(),()=>this.post("places","search-text",
      {QueryText:name,Filter:{Circle:{Center:CAMPUS,Radius:Math.round(NEAR_MI*1609.34)}},MaxResults:1})
      .then(d=>{const p=d.ResultItems?.[0]?.Position;return isPt(p)&&miles(p,CAMPUS)<=NEAR_MI?p:null}));
  }
  // Road route through [lng,lat] points: one {line, mi, min} per leg.
  route(points){
    const body={Origin:points[0],Destination:points[points.length-1],TravelMode:"Car",LegGeometryFormat:"Simple",LegAdditionalFeatures:["Summary"]};
    if(points.length>2)body.Waypoints=points.slice(1,-1).map(p=>({Position:p}));
    return this.cached(this.routes,JSON.stringify(points),()=>this.post("routes","routes",body).then(d=>d.Routes[0].Legs.map(l=>{
      const o=l.VehicleLegDetails.Summary.Overview;return{line:l.Geometry.LineString,mi:o.Distance/1609.34,min:o.Duration/60}})));
  }
}
const geo=new GeoService(CFG);
const mapsReady=()=>geo.ready&&typeof maplibregl!=="undefined";
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches};

// One ride's AppSync Events channel: subscribes over a WebSocket and publishes over HTTPS.
// Every event says who sent it ("rider" or "driver") because subscribers also receive their own events.
class LiveChannel{
  static get ready(){return!!(CFG&&CFG.eventsKey)}
  constructor(cfg,id,{onEvent,onReady}){this.cfg=cfg;this.path="/rides/"+id;this.onEvent=onEvent;this.onReady=onReady;this.closed=false;this.connect()}
  get auth(){return{host:this.cfg.eventsHttp,"x-api-key":this.cfg.eventsKey}}
  connect(){
    const header=btoa(JSON.stringify(this.auth)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
    const ws=this.ws=new WebSocket(`wss://${this.cfg.eventsRealtime}/event/realtime`,["aws-appsync-event-ws","header-"+header]);
    ws.onopen=()=>ws.send(JSON.stringify({type:"connection_init"}));
    ws.onmessage=e=>{const m=JSON.parse(e.data);
      if(m.type==="connection_ack")ws.send(JSON.stringify({type:"subscribe",id:crypto.randomUUID(),channel:this.path,authorization:this.auth}));
      else if(m.type==="subscribe_success")this.onReady?.();
      else if(m.type==="data"){try{const ev=JSON.parse(m.event);if(ev&&typeof ev==="object")this.onEvent(ev)}catch(err){}}
      else if(/error/.test(m.type))console.warn("Live channel:",m)};
    // Phones drop the socket when the screen sleeps, so keep reconnecting until the ride ends.
    ws.onclose=()=>{if(!this.closed)setTimeout(()=>{if(!this.closed)this.connect()},2000)};
  }
  publish(ev){
    return fetch(`https://${this.cfg.eventsHttp}/event`,{method:"POST",headers:{"content-type":"application/json","x-api-key":this.cfg.eventsKey},
      body:JSON.stringify({channel:this.path,events:[JSON.stringify(ev)]})}).catch(()=>{});
  }
  close(){this.closed=true;this.ws?.close()}
}

// MapLibre map of one ride: pickup and drop-off pins, the driver's approach (dashed), the trip, and the car.
class RideMap{
  constructor(el,driverName){
    this.driverName=driverName;this.markers={};this.gone=false;
    this.map=new maplibregl.Map({container:el,style:geo.styleUrl(isDark()),center:CAMPUS,zoom:13,attributionControl:{compact:true}});
    this.map.addControl(new maplibregl.NavigationControl({showCompass:false}),"top-right");
    this.loaded=new Promise(r=>this.map.on("load",r));
  }
  pin(name,at,cls,html=""){
    if(this.gone||!isPt(at))return;
    if(!this.markers[name]){const el=document.createElement("div");el.className=cls;el.innerHTML=html;this.markers[name]=new maplibregl.Marker({element:el}).setLngLat(at).addTo(this.map)}
    else this.markers[name].setLngLat(at);
  }
  stops(pickup,dropoff){
    this.pin("pickup",pickup,"size-4 rounded-full border-4 border-route bg-panel shadow-md");
    this.pin("dropoff",dropoff,"size-4 rounded-full bg-permit shadow-[inset_0_0_0_3px_var(--permit-ink)] shadow-md");
  }
  car(at,isLive){
    this.pin("car",at,"grid size-9 place-items-center rounded-full border-[3px] border-panel font-display text-[.75rem] font-[850] text-white shadow-lg",esc(initials(this.driverName)));
    const el=this.markers.car?.getElement();if(!el)return;
    el.style.background=avColor(this.driverName);el.classList.toggle("ring-4",!!isLive);el.classList.toggle("ring-route/50",!!isLive);
    if(isLive&&!this.map.getBounds().contains(at))this.map.easeTo({center:at});
  }
  async line(id,coords,dashed){
    await this.loaded;if(this.gone)return;
    const data={type:"Feature",properties:{},geometry:{type:"LineString",coordinates:coords}},src=this.map.getSource(id);
    if(src)return src.setData(data);
    const css=getComputedStyle(document.documentElement);
    this.map.addSource(id,{type:"geojson",data});
    this.map.addLayer({id,type:"line",source:id,layout:{"line-cap":"round","line-join":"round"},
      paint:{"line-color":css.getPropertyValue(dashed?"--soft":"--route").trim(),"line-width":dashed?3:5,...(dashed?{"line-dasharray":[1.5,1.5]}:{})}});
  }
  fit(points){
    points=points.filter(isPt);if(this.gone||!points.length)return;
    const b=new maplibregl.LngLatBounds(points[0],points[0]);points.forEach(p=>b.extend(p));
    this.map.fitBounds(b,{padding:40,maxZoom:15,duration:0});
  }
  remove(){this.gone=true;this.map.remove()}
}

// Pins the stops and draws the road route. Resolves to {approach, trip} legs, or null without a route.
async function plotRide(map,{start,pickup,dropoff}){
  map?.stops(pickup,dropoff);map?.fit([start,pickup,dropoff]);
  if(!isPt(start)||!isPt(pickup)||!isPt(dropoff)||!geo.ready)return null;
  const same=miles(start,pickup)<.02;
  const legs=await geo.route(same?[pickup,dropoff]:[start,pickup,dropoff]);
  const out={approach:same?{line:[start,pickup],mi:0,min:0}:legs[0],trip:legs[legs.length-1]};
  if(map){map.line("trip",out.trip.line,false);map.line("approach",out.approach.line,true);map.fit([...out.approach.line,...out.trip.line])}
  return out;
}

// What the open ride screen is showing. Torn down whenever the view re-renders.
let raf,rideMap=null,live=null,rideRT=null;
function teardownRide(){cancelAnimationFrame(raf);rideMap?.remove();live?.close();rideMap=live=rideRT=null}
function startRide(a,d){
  const rt=rideRT={live:false};
  rt.points=Promise.all([d.zone,a.from,a.to].map(p=>geo.locate(p).catch(()=>null))).then(([start,pickup,dropoff])=>({start,pickup,dropoff}));
  if(mapsReady()&&$("#map"))rideMap=new RideMap($("#map"),d.name);
  rt.points.then(async p=>{
    if(rideRT!==rt)return;
    rt.pickup=p.pickup;
    if(!rt.live&&isPt(p.start))rideMap?.car(p.start,false);
    const legs=await plotRide(rideMap,p);
    if(!legs||rideRT!==rt)return;
    rt.approach=legs.approach.line;
    // Swap the straight-line estimate for the road distance and time, once per ride.
    if(a.roadMi===undefined&&legs.approach.mi>0){
      a.roadMi=legs.approach.mi;a.eta=Math.max(1,Math.round(legs.approach.min));save();
      const box=$("#etabox");if(box)box.innerHTML=etaBox(a.eta);
    }
  }).catch(()=>{});
  if(LiveChannel.ready)live=new LiveChannel(CFG,a.live,{onReady:sendTrip,onEvent:onLive});
}
// Tells a driver screen that just joined which ride it's on.
async function sendTrip(){
  const a=S.active,rt=rideRT,ch=live;if(!a||!rt||!ch)return;
  const p=await rt.points,d=drv(a.driverId);
  ch.publish({by:"rider",kind:"trip",code:a.code,from:a.from,to:a.to,rider:first(S.user.name),car:d.car,...p});
}
function onLive(ev){
  const a=S.active,rt=rideRT;if(!a||!rt||ev.by!=="driver")return;
  const n=first(drv(a.driverId).name),note=$("#livestate");
  if(ev.kind==="hello")return sendTrip();
  if(ev.kind==="stop"){
    rt.live=false;const el=rideMap?.markers.car?.getElement();el?.classList.remove("ring-4","ring-route/50");
    if(note)note.textContent=`${n} stopped sharing their location.`;return;
  }
  if(ev.kind!=="pos"||!isPt(ev.at))return;
  // Keep the car near Milledgeville even if an older driver screen sends a far-away position.
  if(miles(ev.at,CAMPUS)>DEMO_RADIUS_MI)ev={...ev,at:DEMO_SPOT,sim:true};
  // Real positions replace the simulated progress for the rest of this screen.
  rt.live=true;cancelAnimationFrame(raf);rideMap?.car(ev.at,true);
  if(note)note.textContent=ev.sim?`${n} is sharing a simulated drive.`:`${n} is sharing their live location.`;
  if(isPt(rt.pickup)){const mi=miles(ev.at,rt.pickup);showStage(mi<.06?3:mi<.4?2:1,mi,Math.max(1,Math.round(mi*3)))}
}

// Simulated progress: the driver heads from their area to the pickup and the status card updates as they go.
function trackRide(){
  cancelAnimationFrame(raf);const a=S.active;if(!a||!$("#st"))return;
  const d=drv(a.driverId);
  if(!a.startedAt){a.startedAt=Date.now();save()}
  const step=()=>{
    // Stop once the ride screen is gone or live positions arrive; it picks up from startedAt when the rider comes back.
    if(S.active!==a||!$("#st")||rideRT?.live)return;
    const total=a.roadMi??(isStop(a.from)?dist(d.zone,a.from):null);
    const k=Math.min(1,(Date.now()-a.startedAt)/12000);
    trip(k,total);
    if(k<1)raf=requestAnimationFrame(step);
  };
  step();
}
function trip(k,total){
  const a=S.active;if(!a)return;
  const left=a.eta===null?null:Math.max(0,Math.ceil(a.eta*(1-k)));
  showStage(k>=1?3:k>.8?2:1,total===null?null:total*(1-k),left);
  if(rideRT?.approach)rideMap?.car(along(rideRT.approach,k),false);
}
function showStage(stage,mi,left){
  const a=S.active;if(!a)return;const d=drv(a.driverId),n=first(d.name);
  const now=$("#st"),sub=$("#stsub");if(!now)return;
  now.textContent=stage===3?`${n} is here. Check the ride code.`:stage===2?`${n} is arriving`:`${n} is on the way`;
  sub.textContent=stage===3?`Look for a ${d.car}.`:mi===null||left===null?`Heading to ${a.from}.`:mi===0?`Already at ${a.from}.`:`${mi.toFixed(1)} mi away, about ${Math.max(1,left)} min.`;
  document.querySelectorAll("#steps span").forEach((x,i)=>x.classList.toggle("on",i<=stage));
  document.querySelectorAll("#steplabels span").forEach((x,i)=>x.innerHTML=i===stage?`<b>${x.textContent}</b>`:x.textContent);
  const eta=$("#etan");if(eta&&left!==null)eta.textContent=stage===3?"0":left;
}

/* ---------- matching ---------- */
function match(){
  const {from,pay,prefer}=S.draft,me=S.user.email,log=myLog();
  const cands=S.drivers.filter(d=>d.online&&d.email!==me&&openSeats(d)>0);
  if(!cands.length)return null;
  const scored=cands.map(d=>{
    const past=log.filter(r=>r.driverId===d.id);
    const mi=dist(d.zone,from);
    const avg=past.length?past.reduce((t,r)=>t+r.rating,0)/past.length:0;
    const overlap=d.pay.filter(p=>pay.includes(p));
    let score=mi===null?0:-mi*2,why=[];
    if(prefer===d.id){score+=100;why.push(`You asked for ${first(d.name)}`)}
    if(past.length){score+=10+past.length*3+avg;why.push(`${past.length} past ride${past.length>1?"s":""} together, ${avg.toFixed(1)} stars`)}
    if(overlap.length){score+=8;why.push(`Takes ${overlap.join(" or ")}`)}else if(pay.length)score-=6;
    if(d.zone===from)why.push(`Already at ${from}`);
    return{d,score,why,eta:mi===null?null:Math.max(2,Math.round(mi*3)+2)};
  }).sort((x,y)=>y.score-x.score);
  return scored[0];
}

/* ---------- real email verification with Amazon Cognito ---------- */
// setup-live-map.sh deploys auth.yaml and adds userPoolId and clientId to window.GCLIFTS_CONFIG in config.js.
// Cognito emails the 6-digit code itself, and a pre-sign-up check on AWS rejects any email outside the school's domains.
// Without them the sign-in falls back to the demo code shown on screen.
const AUTH=(c=>c?.clientId&&c?.region?c:null)(window.GCLIFTS_CONFIG);
let authMode="signup",authErr="";
async function cognito(action,params){
  let res;
  try{res=await fetch(`https://cognito-idp.${AUTH.region}.amazonaws.com/`,{method:"POST",
    headers:{"Content-Type":"application/x-amz-json-1.1","X-Amz-Target":"AWSCognitoIdentityProviderService."+action},
    body:JSON.stringify({ClientId:AUTH.clientId,...params})})}
  catch(e){throw{code:"Network"}}
  const body=await res.json().catch(()=>({}));
  if(!res.ok)throw{code:String(body.__type||"").split("#").pop(),message:body.message||""};
  return body;
}
const authMessage=e=>({
  UsernameExistsException:"An account with this email already exists. Log in instead.",
  UserLambdaValidationException:String(e.message).replace(/^PreSignUp failed with error /,"").replace(/\.?$/,"."),
  InvalidPasswordException:"Use at least 8 characters, including a lowercase letter and a number.",
  InvalidParameterException:"Check the email address and password, then try again.",
  CodeMismatchException:"That code doesn't match. Check the email and try again.",
  ExpiredCodeException:"That code expired. Send a new one.",
  NotAuthorizedException:"Wrong email or password.",
  LimitExceededException:"Too many attempts. Wait a few minutes, then try again.",
  TooManyRequestsException:"Too many attempts. Wait a few minutes, then try again.",
  TooManyFailedAttemptsException:"Too many attempts. Wait a few minutes, then try again.",
  CodeDeliveryFailureException:"We couldn't send the email. Try again in a few minutes.",
  Network:"Can't reach the sign-in service. Check your internet connection.",
}[e.code]||"Something went wrong signing in. Try again.");
// The ID token's middle part holds the verified email and name.
function claims(token){const b=token.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b+"===".slice((b.length+3)%4)),c=>c.charCodeAt(0))))}
async function finishLogin(email,password,sc){
  const r=await cognito("InitiateAuth",{AuthFlow:"USER_PASSWORD_AUTH",AuthParameters:{USERNAME:email,PASSWORD:password}});
  const c=claims(r.AuthenticationResult.IdToken);
  pending=null;authMode="login";authErr="";
  S.user={name:c.name||email.split("@")[0],email:c.email,school:sc.name};if(!S.seeded[c.email])seedRidesFor(c.email);save();render();toast("You're signed in");
}
function cognitoSignin(sc,intro,head){
  const m=authMode,email=pending?.email||"";
  const tab=(k,label)=>`<button type="button" data-mode="${k}" aria-pressed="${m===k}" class="${UI.chip}">${label}</button>`;
  const emailField=`<label for="email" class="${UI.label}">School email<input id="email" class="${UI.input}" type="email" inputmode="email" autocomplete="username" value="${esc(email)}" placeholder="first.last@${esc(sc.domains[1]||sc.domains[0])}"></label>`;

  const pw=(id,label,auto)=>`<label for="${id}" class="${UI.label}">${label}<input id="${id}" class="${UI.input}" type="password" autocomplete="${auto}" minlength="8"></label>`;
  const body={
    signup:`<div class="${UI.chips}">${tab("signup","Create account")}${tab("login","Log in")}</div>${emailField}
      <label for="name" class="${UI.label}">Your name<input id="name" class="${UI.input}" autocomplete="name" placeholder="First and last name"></label>
      ${pw("password","Password","new-password")}<p class="${UI.hint}">At least 8 characters, including a lowercase letter and a number.</p>
      <p class="${UI.err}" id="err"></p><button class="${UI.go}">Create account</button>`,
    login:`<div class="${UI.chips}">${tab("signup","Create account")}${tab("login","Log in")}</div>${emailField}${pw("password","Password","current-password")}
      <p class="${UI.err}" id="err"></p><button class="${UI.go}">Log in</button>
      <button type="button" class="${UI.quiet}" data-mode="forgot">Forgot your password?</button>`,
    confirm:`<h3 class="${UI.h3}">Check your email</h3>
      <p class="${UI.hint}">We emailed a 6-digit code to <b class="[overflow-wrap:anywhere] text-ink">${esc(email)}</b>. Enter it to confirm the address is yours. It can take a minute, and it may land in junk mail.</p>
      ${codeField}<p class="${UI.err}" id="err"></p><button class="${UI.go}">Verify email</button>
      <div class="flex flex-wrap gap-2"><button type="button" class="${UI.quiet}" id="resend">Send a new code</button><button type="button" class="${UI.quiet}" data-mode="signup">Use a different email</button></div>`,
    forgot:`<h3 class="${UI.h3}">Reset your password</h3><p class="${UI.hint}">We'll email you a code to set a new password.</p>${emailField}
      <p class="${UI.err}" id="err"></p><button class="${UI.go}">Email me a code</button><button type="button" class="${UI.quiet}" data-mode="login">Back to log in</button>`,
    reset:`<h3 class="${UI.h3}">Set a new password</h3><p class="${UI.hint}">If <b class="[overflow-wrap:anywhere] text-ink">${esc(email)}</b> has an account, we emailed it a code.</p>
      ${codeField}${pw("password","New password","new-password")}<p class="${UI.hint}">At least 8 characters, including a lowercase letter and a number.</p>
      <p class="${UI.err}" id="err"></p><button class="${UI.go}">Save new password</button><button type="button" class="${UI.quiet}" data-mode="login">Back to log in</button>`,
  }[m];
  $("#view").innerHTML=`<div class="${UI.stack}">${intro}<form id="f" class="${UI.form}" novalidate>${head}${body}</form></div>`;
  $("#err").textContent=authErr;authErr="";
  ($("#code")||$("#email")).focus();
  $("#change").onclick=()=>{pickedSchool=null;pending=null;authMode="signup";signin()};
  $("#f").onclick=e=>{const b=e.target.closest("[data-mode]");if(!b)return;authMode=b.dataset.mode;if(authMode==="signup"||authMode==="login")pending=pending&&{email:pending.email};signin()};
  if($("#resend"))$("#resend").onclick=async e=>{e.currentTarget.disabled=true;
    try{await cognito("ResendConfirmationCode",{Username:email});toast("We sent a new code")}catch(x){$("#err").textContent=authMessage(x)}
    finally{if(e.target.isConnected)e.target.disabled=false}};
  $("#f").onsubmit=async e=>{e.preventDefault();const btn=e.submitter||$("#f .min-h-12"),err=$("#err");err.textContent="";
    const val=id=>$("#"+id)?.value.trim()||"",em=(val("email")||email).toLowerCase(),dom=em.split("@")[1]||"";
    if(["signup","login","forgot"].includes(m)&&(!/^[^@\s]+@[^@\s]+$/.test(em)||!sc.domains.includes(dom)))
      return err.textContent=`Use your ${sc.name} email. It must end in @${sc.domains.join(" or @")}.`;
    if(m==="signup"&&!val("name"))return err.textContent="Enter your name so drivers know who to pick up.";
    if(["signup","login","reset"].includes(m)&&!$("#password").value)return err.textContent="Enter your password.";
    if(["confirm","reset"].includes(m)&&!/^\d{6}$/.test(val("code")))return err.textContent="Enter the 6-digit code from the email.";
    btn.disabled=true;
    try{
      if(m==="signup"){const password=$("#password").value;
        await cognito("SignUp",{Username:em,Password:password,UserAttributes:[{Name:"email",Value:em},{Name:"name",Value:val("name")}]});
        pending={email:em,password};authMode="confirm";signin();}
      else if(m==="confirm"){
        try{await cognito("ConfirmSignUp",{Username:em,ConfirmationCode:val("code")})}
        catch(x){if(x.code!=="NotAuthorizedException")throw x}   // already confirmed: go straight to logging in
        if(pending?.password)await finishLogin(em,pending.password,sc);

      else if(m==="login"){const password=$("#password").value;
        try{await finishLogin(em,password,sc)}
        catch(x){if(x.code!=="UserNotConfirmedException")throw x;
          await cognito("ResendConfirmationCode",{Username:em});pending={email:em,password};authMode="confirm";signin();toast("Confirm your email first. We sent a new code.")}}
      else if(m==="forgot"){await cognito("ForgotPassword",{Username:em});pending={email:em};authMode="reset";signin()}
      else if(m==="reset"){const password=$("#password").value;
        await cognito("ConfirmForgotPassword",{Username:em,ConfirmationCode:val("code"),Password:password});await finishLogin(em,password,sc)}
    }catch(x){if(btn.isConnected){btn.disabled=false;err.textContent=authMessage(x)}else{authErr=authMessage(x);signin()}}
  };
}

        <span class="h-3.5 w-0.5 justify-self-center bg-rule"></span><span></span>
        <span class="size-3 justify-self-center rounded-full bg-permit shadow-[inset_0_0_0_2px_var(--permit-ink)]"></span><label for="to" class="${UI.label}">Drop-off<input id="to" class="${UI.input}" value="${esc(D.to)}" placeholder="Store, clinic or address" autocomplete="off"></label>

      <p class="${UI.err}" id="err"></p>
      ${(()=>{const on=S.drivers.filter(d=>d.online&&d.email!==S.user.email&&openSeats(d)>0);return on.length?`<div class="flex flex-wrap items-center gap-2.5 text-sm text-soft"><span class="flex *:-ml-2 *:first:ml-0">${on.slice(0,5).map(d=>`<span class="grid size-[30px] place-items-center rounded-full border-2 border-panel font-display text-[.7rem] font-[850] text-white" style="background:${avColor(d.name)}" title="${esc(d.name)}">${initials(d.name)}</span>`).join("")}</span><span>${on.length} driver${on.length>1?"s":""} available to drive now</span></div>`:`<div class="text-sm text-soft">No drivers are available right now.</div>`})()}
      <button class="${UI.go}" id="go">Find my driver</button>
    </div>
    ${past.length?`<div class="${UI.tight}"><h3 class="${UI.h3}">Ride again with someone you know</h3>
      <p class="${UI.hint}">Tap a driver to ask for them. If they're free, you're matched with them first.</p>
      <div class="${UI.profiles}" id="again">${past.map(d=>profile(d,{tag:"button",attrs:`type="button" data-id="${d.id}" aria-pressed="${D.prefer===d.id}"`,paid:D.pay,
        footer:`<span></span><span class="req text-sm font-bold text-route">${D.prefer===d.id?"Requested":"Request"}</span>`})).join("")}</div></div>`:""}
  </div>`;
  const route=()=>{const el=$("#route"),want=D.from+"|"+D.to;el.textContent=routeHint(D.from,D.to);
    clearTimeout(route.t);if(!geo.ready||!D.from||!D.to||samePlace(D.from,D.to))return;
    // Wait for a pause in typing so each keystroke isn't a billed lookup.
    route.t=setTimeout(async()=>{
      const still=()=>el.isConnected&&D.from+"|"+D.to===want;
      try{const [p,q]=await Promise.all([geo.locate(D.from),geo.locate(D.to)]);if(!still())return;
        if(!p||!q)return el.textContent="Couldn't find that place on the map. You can still request a ride.";
        const [leg]=await geo.route([p,q]);if(still())el.textContent=`${leg.mi.toFixed(1)} mi by road, about ${Math.max(1,Math.round(leg.min))} min drive.`}
      // Two known stops already show a straight-line estimate, so only replace the "Finding..." text.
      catch(e){if(still()&&!(isStop(D.from)&&isStop(D.to)))el.textContent="Couldn't reach the map service. You can still request a ride."}},600)};
  route();
  $("#from").oninput=e=>{D.from=known(e.target.value);save();route()};
  $("#to").oninput=e=>{D.to=known(e.target.value);save();route()};
  $("#pay").onclick=e=>{const c=e.target.closest("button");if(!c)return;const on=c.getAttribute("aria-pressed")!=="true";c.setAttribute("aria-pressed",on);
    D.pay=on?[...D.pay,c.textContent]:D.pay.filter(p=>p!==c.textContent);save()};
  const ag=$("#again");if(ag)ag.onclick=e=>{const b=e.target.closest("[data-id]");if(!b)return;D.prefer=D.prefer===b.dataset.id?null:b.dataset.id;
    ag.querySelectorAll("[data-id]").forEach(x=>{const on=x.dataset.id===D.prefer;x.setAttribute("aria-pressed",on);x.querySelector(".req").textContent=on?"Requested":"Request"});save()};
  $("#go").onclick=()=>{
    if(!D.from||!D.to)return $("#err").textContent="Type where you want to be picked up and dropped off.";
    if(samePlace(D.from,D.to))return $("#err").textContent="Pickup and drop-off are the same place. Change one of them.";
    if(!D.pay.length)return $("#err").textContent="Choose at least one way you can pay.";
    const m=match();
    if(!m)return $("#err").textContent="No drivers are online right now. Try again in a few minutes.";
    S.active={driverId:m.d.id,from:D.from,to:D.to,why:m.why,eta:m.eta,pay:[...D.pay],code:code(),when:new Date().toISOString(),live:crypto.randomUUID()};
    D.prefer=null;save();render();toast(`Matched with ${first(m.d.name)}`);
  };
}

const REPLIES=[[/where|which|spot|find/i,"I'll pull up right out front. Look for the {car}."],[/late|minute|wait|hold/i,"No problem, I'll wait a couple of minutes."],
  [/pay|venmo|paypal|cash/i,"{pay}"],[/thank|thx|ty\b/i,"Anytime!"],[/.*/,"Sounds good, see you soon."]];
// Keyed by driver id, not stored on the driver, so browsers with a saved driver list get it too.
const GREETING={d2:"Hi, im in a Blue Toyota RAV4. Im 3 minutes out. It will be $3. Venmo: @Alisha"};
const MSG={
  me:"max-w-[80%] self-end rounded-[14px] rounded-br-[4px] bg-route px-3 py-2 text-[.92rem] leading-[1.4] [overflow-wrap:anywhere] text-panel",
  them:"max-w-[80%] self-start rounded-[14px] rounded-bl-[4px] border border-rule bg-ground px-3 py-2 text-[.92rem] leading-[1.4] [overflow-wrap:anywhere]",
};
const STAR_WORDS=["","Poor","Fair","Okay","Good","Great"];
const stars=n=>`<span class="text-[#c99400]" role="img" aria-label="${n} of 5 stars">${"★".repeat(n)}</span>`;
// Native radios keep arrow-key and screen-reader support; the stars are their labels.
function starPicker(n){
  return `<fieldset class="flex flex-col gap-1.5" id="stars"><legend class="${UI.legend}">Rate your ride with ${esc(n)}</legend>
    <div class="flex flex-wrap items-center gap-1">${[1,2,3,4,5].map(v=>`<label class="cursor-pointer"><input type="radio" name="rate" value="${v}" class="peer sr-only" aria-label="${v} star${v>1?"s":""}, ${STAR_WORDS[v]}">
      <span aria-hidden="true" class="grid size-11 place-items-center rounded-lg text-[2rem] leading-none text-soft peer-focus-visible:outline-[3px] peer-focus-visible:outline-route data-[on]:text-[#c99400]">☆</span></label>`).join("")}
      <span class="ml-2 text-sm font-bold" id="starword"></span></div></fieldset>`;
}
// The pick lives on the active ride so switching tabs and back doesn't lose it.
function wireStars(a){
  const box=$("#stars"),marks=[...box.querySelectorAll("span[aria-hidden]")];
  const show=v=>{marks.forEach((m,i)=>{const on=i<v;m.toggleAttribute("data-on",on);m.textContent=on?"★":"☆"});$("#starword").textContent=STAR_WORDS[v]};
  const picked=()=>+(box.querySelector("input:checked")?.value||0);
  box.onchange=()=>{a.rating=picked();save();show(a.rating);$("#doneErr").textContent=""};
  box.onmouseover=e=>{const i=e.target.closest("label")?.querySelector("input");if(i)show(+i.value)};
  box.onmouseleave=()=>show(picked());
  if(a.rating){box.querySelector(`input[value="${a.rating}"]`).checked=true;show(a.rating)}
}
const etaBox=eta=>eta===null?`<div class="text-right"><small class="block text-[.8rem] font-semibold text-soft">On the way</small></div>`
  :`<div class="text-right font-display text-[2rem] leading-none font-black tabular-nums [font-stretch:80%]"><span id="etan">${eta}</span><small class="block font-body text-[.8rem] font-semibold text-soft">min away</small></div>`;
function activeView(){
  const a=S.active,d=drv(a.driverId),ok=d.pay.filter(p=>a.pay.includes(p)),n=first(d.name);
  if(!a.chat){a.chat=[{who:"them",text:GREETING[d.id]||`Hey, it's ${n}. I'm on my way in the ${d.car}.`,t:Date.now()}];save()}

        <div id="etabox">${etaBox(a.eta)}</div></div>
      <div class="flex flex-wrap items-center justify-between gap-x-3 gap-y-1 border-y border-rule py-3"><span class="text-sm font-semibold">Ride code. Ask ${esc(n)} to say it before you get in.</span><span class="font-display text-[2rem] leading-none font-black tracking-[.02em] tabular-nums [font-stretch:62%]">${a.code}</span></div>
      <p class="${UI.hint}">${a.why.length?esc(a.why.join(". "))+".":"Closest driver who's online."}</p>

      <div class="${UI.tight}"><h3 class="${UI.h3}">${esc(n)}'s live location</h3>

    <div class="${UI.form}">

const RIDER_REPLIES=[[/paid|pay|sent|money|venmo|paypal|cash/i,"{paid}"],[/thank|thx|ty\b/i,"Thank you for the ride!"],[/.*/,"Sounds good!"]];

      if(f.dataset.act==="report")return sendReport(f,r);
      const inp=f.querySelector("input"),t=inp.value.trim();if(!t)return;
      r.chat=r.chat||[];r.chat.push({who:"driver",text:t,t:Date.now()});inp.value="";save();
      const box=li.querySelector("[data-chat]"),sum=li.querySelector("summary"),show=()=>{const v={...r,riderName:r.riderName||"A rider"};box.innerHTML=driverBubbles(v);box.scrollTop=box.scrollHeight;sum.textContent=`Messages with ${first(v.riderName)} (${r.chat.length})`};show();
      // Sample riders answer automatically; a rider on this browser reads it in their own account.
      if(r.sample)setTimeout(()=>{r.chat.push({who:"rider",text:RIDER_REPLIES.find(([re])=>re.test(t))[1].replace("{paid}",paidNote(r.paidWith)),t:Date.now()});save();if(li.isConnected)show()},1400)};
  }
  function sendReport(f,r){
    const reason=f.querySelector("input:checked")?.value,note=f.querySelector("textarea").value.trim(),err=f.querySelector("[data-err]");
    if(!reason)return err.textContent="Pick what happened.";
    if(reason==="Other"&&!note)return err.textContent="Add a few words about what happened.";
    r.report={reason,note,at:Date.now()};save();driveView();toast(`Report about ${first(r.riderName||"your rider")} sent`);
  }
  $("#dpay").onclick=e=>{const c=e.target.closest("button");if(c)c.setAttribute("aria-pressed",c.getAttribute("aria-pressed")!=="true")};
  $("#saveD").onclick=()=>{
    const pay=[...document.querySelectorAll("#dpay button[aria-pressed=true]")].map(c=>c.textContent);
    const car=$("#car").value.trim();
    if(!car)return $("#err").textContent="Add your car so riders can spot you.";
    if(!pay.length)return $("#err").textContent="Pick at least one way you'd like to be paid.";
    const data={name:S.user.name,email:S.user.email,car,
      seats:Math.max(1,+$("#seats").value||1),pay,online:$("#online").checked,zone:$("#zone").value};
    if(me)Object.assign(me,data);else S.drivers.push({id:"u-"+S.user.email,...data});
    seedRidersFor(S.drivers.find(d=>d.email===S.user.email));save();driveView();toast(data.online?"Driver profile saved. You're available.":"Driver profile saved");
  };
}

function logView(){
  const log=myLog();
  const by={};log.forEach(r=>(by[r.driverId]=by[r.driverId]||[]).push(r));
  const people=Object.entries(by).sort((a,b)=>b[1].length-a[1].length);
  const payCount={};log.forEach(r=>payCount[r.paidWith]=(payCount[r.paidWith]||0)+1);
  const topPay=Object.entries(payCount).sort((a,b)=>b[1]-a[1])[0];
  const fmt=fmtDay,paystat=payStatus;
  const name=r=>{const d=drv(r.driverId);return d?first(d.name):""};
  $("#view").innerHTML=`<div class="${UI.stack}">
    <h2 class="${UI.h2}">Ride log</h2>
    ${log.length?`<p class="max-w-[36ch] font-display text-[1.15rem] leading-[1.35] font-bold [font-stretch:105%]">${log.length} ride${log.length>1?"s":""} with ${people.length} driver${people.length>1?"s":""}. You pay with ${esc(topPay[0])} most often.</p>`:""}
    <div class="${UI.tight}"><h3 class="${UI.h3}">Drivers you've ridden with</h3>
      <div class="${UI.profiles}">${people.map(([id,rs])=>{const d=drv(id);if(!d)return"";const paid=[...new Set(rs.map(r=>r.paidWith))];
        return profile(d,{paid,footer:`<span class="${UI.sub}">Last ride ${fmt(rs[0].when)}. You paid with ${paid.map(esc).join(", ")}.</span>`})}).join("")
        ||`<p class="${UI.hint}">No rides yet. After your first ride, that driver shows up here and gets matched with you first next time.</p>`}</div></div>
    ${log.length?`<div class="${UI.tight}"><h3 class="${UI.h3}">Every ride</h3>
      <ul class="flex flex-col sm:hidden *:border-t *:border-rule *:py-3">
      ${log.map(r=>`<li><div class="flex justify-between gap-3"><span class="font-semibold">${esc(r.from)} to ${esc(r.to)}</span><span class="shrink-0 tabular-nums text-soft">${fmt(r.when)}</span></div>
        <div class="${UI.sub}">${esc(name(r))} · ${esc(r.paidWith)} · ${stars(r.rating)}</div>
        ${r.review?`<p class="${UI.sub} [overflow-wrap:anywhere]">"${esc(r.review)}"</p>`:""}
        <div>${paystat(r)}</div></li>`).join("")}
      </ul>
      <div class="hidden overflow-x-auto sm:block"><table class="w-full min-w-[440px] border-collapse text-sm [&_td]:border-b [&_td]:border-rule [&_td]:px-2 [&_td]:py-2.5 [&_td]:text-left [&_th]:border-b [&_th]:border-rule [&_th]:px-2 [&_th]:py-2.5 [&_th]:text-left [&_th]:text-xs [&_th]:font-semibold [&_th]:text-soft">
      <thead><tr><th>Date</th><th>Trip</th><th>Driver</th><th>Payment</th><th>Rating</th></tr></thead><tbody>
      ${log.map(r=>`<tr><td class="whitespace-nowrap tabular-nums">${fmt(r.when)}</td><td>${esc(r.from)} to ${esc(r.to)}${r.review?`<span class="block text-soft [overflow-wrap:anywhere]">"${esc(r.review)}"</span>`:""}</td><td>${esc(name(r))}</td><td>${esc(r.paidWith)} ${paystat(r)}</td><td class="whitespace-nowrap">${stars(r.rating)}</td></tr>`).join("")}
      </tbody></table></div></div>`:""}
    <div class="flex flex-wrap gap-2.5"><button class="${UI.quiet}" id="reset">Reset my sample rides</button></div>
  </div>`;
  $("#reset").onclick=()=>{S.active=null;seedRidesFor(S.user.email);save();render();toast("Your sample rides were restored")};
}

// Opened from a rider's driver link. Shares this device's location (or a simulated drive) on that ride's channel only.
function liveDriverView(id){
  $("#who").textContent="Driver screen";
  if(!LiveChannel.ready){$("#view").innerHTML=`<p class="${UI.hint}">Live tracking isn't set up on this copy of GClifts. Run setup-live-map.sh to turn it on.</p>`;return}
  $("#view").innerHTML=`<div class="${UI.stack}">
    <h2 class="${UI.h2}">Share your drive</h2>
    <div class="flex flex-col gap-1.5 rounded-2xl border border-rule bg-panel p-4 sm:p-5" aria-live="polite">
      <div class="font-display text-[1.3rem] leading-[1.2] font-extrabold [font-stretch:108%]" id="dtrip">Connecting to the ride...</div>
      <div class="${UI.sub}" id="dsub">This can take a few seconds. The rider's ride screen needs to be open.</div>
    </div>
    ${mapsReady()?`<div id="map" class="${UI.map}" role="region" aria-label="Map of the ride"></div>`:""}
    <div class="${UI.form}">
      <button class="${UI.go}" id="share" disabled>Share my live location</button>
      <button class="${UI.quiet}" id="sim" disabled>Simulate the drive</button>
      <button class="${UI.go}" id="stopShare" hidden>Stop sharing</button>
      <p class="${UI.err}" id="derr" aria-live="polite"></p>
      <p class="${UI.hint}">Your rider sees where you are only while you share, and only for this ride. Sharing stops when you tap Stop or the rider ends the ride. GClifts doesn't save your location.</p>
      <p class="${UI.hint}">Simulate the drive sends points along the real road route from your area to the pickup, for demos away from Milledgeville. If you share your location from more than ${DEMO_RADIUS_MI} miles away, the rider sees a made-up spot near GCSU instead.</p>
    </div></div>`;
  const map=mapsReady()?new RideMap($("#map"),S.user?.name||"Driver"):null;
  let trip=null,watch=null,timer=null,last=0;
  const err=t=>$("#derr").textContent=t;
  const sharing=on=>{$("#share").hidden=$("#sim").hidden=on;$("#stopShare").hidden=!on};
  const send=(at,sim)=>{ch.publish({by:"driver",kind:"pos",at,sim});map?.car(at,true)};
  function stop(notify){
    if(watch!==null)navigator.geolocation.clearWatch(watch);clearInterval(timer);
    const was=watch!==null||timer!==null;watch=timer=null;sharing(false);
    if(notify&&was)ch.publish({by:"driver",kind:"stop"});
  }
  const ch=new LiveChannel(CFG,id,{onReady:()=>ch.publish({by:"driver",kind:"hello"}),onEvent:ev=>{
    if(ev.by!=="rider")return;
    if(ev.kind==="end"){stop(false);ch.close();$("#share").disabled=$("#sim").disabled=true;
      $("#dtrip").textContent="This ride has ended";$("#dsub").textContent="Location sharing stopped. You can close this page.";return}
    if(ev.kind!=="trip"||trip)return;
    trip={code:String(ev.code||""),from:String(ev.from||""),to:String(ev.to||""),rider:String(ev.rider||"your rider"),
      start:isPt(ev.start)?ev.start:null,pickup:isPt(ev.pickup)?ev.pickup:null,dropoff:isPt(ev.dropoff)?ev.dropoff:null};
    $("#dtrip").textContent=`Pick up ${trip.rider} at ${trip.from}`;
    $("#dsub").textContent=`Drop-off: ${trip.to}. Say the ride code ${trip.code} before they get in.`;
    $("#share").disabled=false;$("#sim").disabled=!(trip.start&&trip.pickup);
    if(trip.start)map?.car(trip.start,false);
    plotRide(map,trip).catch(()=>{});
  }});
  // Shares the made-up spot near GCSU instead of a real location. Kept in sync every 2 seconds,
  // like a real fix, so a rider screen that opens late still gets it.
  const demoSpot=why=>{
    if(watch!==null)navigator.geolocation.clearWatch(watch);watch=null;clearInterval(timer);
    $("#dsub").textContent=`${why} Showing a made-up location near GCSU instead.`;
    send(DEMO_SPOT,true);timer=setInterval(()=>send(DEMO_SPOT,true),2000);
  };
  $("#share").onclick=()=>{err("");sharing(true);
    if(!navigator.geolocation)return demoSpot("This browser can't share its location.");
    // A position every 2 seconds is plenty for a car on town streets and keeps the event count low.
    watch=navigator.geolocation.watchPosition(p=>{if(Date.now()-last<2000)return;last=Date.now();
        const at=[p.coords.longitude,p.coords.latitude];
        if(miles(at,CAMPUS)>DEMO_RADIUS_MI)return demoSpot("You're not near Milledgeville.");
        send(at,false)},
      e=>demoSpot(e.code===1?"Location permission was denied.":"Couldn't get your location."),
      {enableHighAccuracy:true,maximumAge:5000});
  };
  $("#sim").onclick=async()=>{err("");sharing(true);
    let line=[trip.start,trip.pickup];
    try{if(miles(trip.start,trip.pickup)>.02)line=(await geo.route([trip.start,trip.pickup]))[0].line}catch(e){}
    if($("#stopShare").hidden)return;  // stopped while the route loaded
    let k=0;send(line[0],true);
    timer=setInterval(()=>{k=Math.min(1,k+1/30);send(along(line,k),true);
      if(k>=1){clearInterval(timer);$("#dsub").textContent=`You're at the pickup. Say the ride code ${trip.code}.`}},1000);
  };
  $("#stopShare").onclick=()=>stop(true);
  addEventListener("pagehide",()=>stop(true));
}

$("#logout").onclick=logout;
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.tab=b.dataset.tab;save();render()};
if(DRIVE_ID)liveDriverView(DRIVE_ID);else render();
// Pasting a driver link into an open tab only changes the hash, so reload to switch screens.
addEventListener("hashchange",()=>{if(DRIVE_ID||/^#drive=/.test(location.hash))location.reload()});
</script>
