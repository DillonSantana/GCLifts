AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GClifts sign-in: an Amazon Cognito user pool that emails a 6-digit code to verify each student's school email.
  Only @gcsu.edu and @bobcats.gcsu.edu addresses can sign up. setup-live-map.sh deploys it as the stack "gclifts-auth".

Parameters:
  AllowedDomains:
    Type: CommaDelimitedList
    Default: "gcsu.edu,bobcats.gcsu.edu"
    Description: Email domains that may create an account.

Resources:
  # Runs before Cognito creates an account, so the domain rule holds even if someone calls the sign-up API directly.
  PreSignUpRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - {Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  PreSignUpFunction:
    Type: AWS::Lambda::Function
    Properties:
      Description: Rejects GClifts sign-ups from email addresses outside the school's domains
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt PreSignUpRole.Arn
      Timeout: 5
      Environment:
        Variables:
          ALLOWED_DOMAINS: !Join [",", !Ref AllowedDomains]
      Code:
        ZipFile: |
          exports.handler = async (event) => {
            const allowed = process.env.ALLOWED_DOMAINS.split(",").map(d => d.trim().toLowerCase());
            const email = String(event.request.userAttributes.email || "").toLowerCase();
            if (!allowed.includes(email.split("@")[1] || "")) {
              throw new Error("Use your Georgia College email. It must end in @" + allowed.join(" or @"));
            }
            return event;
          };

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: gclifts-students
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Schema:
        - {Name: email, AttributeDataType: String, Required: true, Mutable: true}
        - {Name: name, AttributeDataType: String, Required: true, Mutable: true}
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - {Name: verified_email, Priority: 1}
      # Cognito sends the emails itself: no Amazon SES setup, limited to a small number of emails per day.
      # For more, switch to DEVELOPER with a verified SES address.
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your GClifts verification code
        EmailMessage: "Your GClifts verification code is {####}. Enter it in the app to confirm your school email."
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PreSignUpFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # The website's client: no secret (it runs in the browser), email + password sign-in, and no hints about which emails have accounts.
  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: gclifts-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  ClientId:
    Value: !Ref WebClient
  ConfigJs:
    Description: The two settings setup-live-map.sh adds to window.GCLIFTS_CONFIG in config.js
    Value: !Sub 'userPoolId:"${UserPool}",clientId:"${WebClient}"'
